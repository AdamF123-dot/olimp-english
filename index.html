<script>
(function(){
'use strict';
var BANK=JSON.parse(document.getElementById('bank').textContent);
var KEY='olimp-english-v1';
var $=function(s){return document.querySelector(s);};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var fmt=function(s){return esc(s).replace(/_{3,}/g,'<span class="blank"></span>');};
var shuffle=function(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;};
var ico=function(n,s){s=s||22;return '<svg class="i" width="'+s+'" height="'+s+'" aria-hidden="true"><use href="#i-'+n+'"/></svg>';};

/* ---------- stan ---------- */
function def(){return {xp:0,streak:0,best:0,last:null,hearts:5,hts:Date.now(),goal:50,daily:{d:'',xp:0},
  done:{},mistakes:[],wrong:{},badges:{},us:{},stats:{answered:0,correct:0,lessons:0,perfect:0,fixed:0},
  custom:{units:[],questions:[],passages:{}},sound:true,stage:'szkolny',ansMode:'write'};}
function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);var d=def();for(var k in o)d[k]=o[k];if(!d.custom.passages)d.custom.passages={};return d;}}catch(e){}return def();}
var S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
var dstr=function(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
var today=function(){return dstr(new Date());};
var yesterday=function(){var d=new Date();d.setDate(d.getDate()-1);return dstr(d);};
function rollDaily(){if(S.daily.d!==today())S.daily={d:today(),xp:0};}
function streakNow(){if(!S.last)return 0;return (S.last===today()||S.last===yesterday())?S.streak:0;}
var pd=function(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);};
function stageDone(st){var us=units().filter(function(u){return stageOf(u)===st;});return us.length>0&&us.every(function(u){var ls=lessonsOf(u);return ls.length&&ls.every(function(_,i){return S.done[lkey(u,i)]>0;});});}
var N=function(k){return S.stats[k]||0;};
function updateStreak(){var t=today();if(S.last===t)return;if(S.last&&Math.round((pd(t)-pd(S.last))/86400000)>=3)S.stats.comeback=N('comeback')+1;S.streak=(S.last===yesterday())?S.streak+1:1;S.last=t;S.best=Math.max(S.best||0,S.streak);}

var HEART_MS=20*60*1000,MAXH=5;
function tickHearts(){S.hearts=MAXH;return;var now=Date.now();if(S.hearts>=MAXH){S.hts=now;return;}var n=Math.floor((now-S.hts)/HEART_MS);if(n>0){S.hearts=Math.min(MAXH,S.hearts+n);S.hts=S.hearts>=MAXH?now:S.hts+n*HEART_MS;}}
function loseHeart(){}/* serca nieograniczone */
function nextHeartMs(){return Math.max(0,HEART_MS-(Date.now()-S.hts));}
function mmss(ms){var s=Math.ceil(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}

var LEVELS=([{xp:0,name:'Debiutant'},{xp:100,name:'Biegacz'},{xp:250,name:'Sprinter'},{xp:450,name:'Brązowy medalista'},{xp:700,name:'Srebrny medalista'},{xp:1000,name:'Złoty medalista'},{xp:1500,name:'Mistrz olimpiady'},{xp:2200,name:'Rekordzista'},{xp:3200,name:'Legenda konkursu'}]);
function levelOf(xp){var r=0;LEVELS.forEach(function(l,k){if(xp>=l.xp)r=k;});return r;}

/* ---------- dane ---------- */

}

  var nb=checkBadges(),lv1=levelOf(S.xp);
  R={mode:L.mode,xp:xp,acc:acc,bonus:bonus,streak:streakNow(),lvup:lv1>lv0?LEVELS[lv1].name:null,badges:nb,perfect:acc===100,goalHit:goalHit,streakMs:(sa>sb&&[3,5,7,10,14,21,30,50,100].indexOf(sa)>=0)?sa:0,praise:resultPraise(acc,L.mode)};
  save();L=null;view='result';beep(SND.win);confetti();render();window.scrollTo(0,0);
}
function resultPraise(acc,mode){
  var p=function(a){return a[Math.floor(Math.random()*a.length)];};
  if(mode==='review')return p(['Poprawiasz błędy. To najlepszy sposób nauki, Konradek!','Każdy poprawiony błąd to krok do medalu.']);
  if(acc===100)return p(['Bezbłędnie, Konradek! Jak prawdziwy mistrz.','Komplet punktów! Tak wygrywa się konkursy.','Ani jednej pomyłki. Brawo!']);
  if(acc>=80)return p(['Bardzo dobry wynik, Konradek!','Świetna robota. Jeszcze krok do perfekcji.']);
  if(acc>=60)return p(['Dobra robota. Błędne pytania wrócą w powtórce.','Dobry wynik, a powtórka błędów zrobi z niego świetny.']);
  return p(['Najważniejsze, że ćwiczysz. Następnym razem będzie lepiej.','Trudna lekcja, ale zrobiona. Poradzisz sobie z powtórką.']);
}
function resultHTML(){
  var h='<div class="res"><div class="medal">'+ico(R.perfect?'trophy':'medal',72)+'</div><h1>'+(R.mode==='review'?'Powtórka zaliczona!':R.perfect?'Bezbłędnie!':R.acc>=80?'Świetny wynik!':'Lekcja ukończona!')+'</h1><p class="praisep">'+esc(R.praise)+'</p>';
  h+='<div class="tiles"><div class="tile"><b style="color:var(--gold-sh)">+'+R.xp+'</b><span>XP</span></div><div class="tile"><b>'+R.acc+'%</b><span>Trafność</span></div><div class="tile"><b style="color:var(--flame)">'+R.streak+'</b><span>Dni z rzędu</span></div></div>';
  if(R.bonus)h+='<p class="muted" style="margin-bottom:12px">W tym '+R.bonus+' XP bonusu za dokładność</p>';
  if(R.goalHit)h+='<div class="banner praise"><span style="color:var(--ok)">'+ico('bolt',34)+'</span><div>Cel dnia zaliczony!<br><span class="muted" style="font-weight:600;font-size:13px">Masz już '+S.daily.xp+' XP dzisiaj.</span></div></div>';
  if(R.streakMs)h+='<div class="banner fire"><span style="color:var(--flame)">'+ico('flame',34)+'</span><div>Seria '+R.streakMs+' dni!<br><span class="muted" style="font-weight:600;font-size:13px">Regularność robi różnicę.</span></div></div>';
  if(R.lvup)h+='<div class="banner lvup"><span style="color:var(--gold)">'+ico('medal',34)+'</span><div>Nowy poziom: '+esc(R.lvup)+'</div></div>';
  R.badges.forEach(function(b){h+='<div class="banner bdg"><span style="color:'+b.c+'">'+ico(b.icon,34)+'</span><div>Nowa odznaka: '+esc(b.name)+'<br><span class="muted" style="font-weight:600;font-size:13px">'+esc(b.desc)+'</span></div></div>';});
  return h+'<button class="btn gold" style="width:100%;margin-top:14px" data-act="done">Kontynuuj</button></div>';
}
function noheartsHTML(){
  tickHearts();
  return '<div class="res"><div class="medal" style="background:var(--surface2);color:var(--heart);box-shadow:0 8px 0 var(--line)">'+ico('heart',72)+'</div><h1>Skończyły się serca</h1><p class="muted" style="margin:10px 0 20px">Następne serce za <b id="hl">'+mmss(nextHeartMs())+'</b>.<br>Powtórka błędów też od razu odnawia serce.</p>'
   +(S.mistakes.length?'<button class="btn" style="width:100%;margin-bottom:12px" data-act="review">Powtórka błędów ('+S.mistakes.length+')</button>':'')
   +'<button class="btn ghost" style="width:100%" data-act="done">Wróć do ścieżki</button></div>';
}

function cheatHTML(){
  var u=unitOf(cheat);if(!u||!u.cards){cheat=null;return '';}
  return '<div class="scrim"><div class="sheet cheat"><div class="row between"><h3>Ściąga</h3><button class="icon-btn" data-act="cheatclose" aria-label="Zamknij">'+ico('x',22)+'</button></div><p class="muted" style="margin-top:-6px">'+esc(u.title)+'</p>'+u.cards.map(function(c){return '<div class="ck"><b>'+esc(c.h)+'</b><p>'+esc(c.t)+'</p><div class="ex">'+esc(c.ex)+'</div></div>';}).join('')+'<button class="btn" data-act="cheatclose">Rozumiem</button></div></div>';
}
function render(){
  tickHearts();var app=$('#app'),h='';
  if(view==='lesson'&&L)h=lessonHTML();
  else if(view==='result'&&R)h=resultHTML();
  else if(view==='nohearts')h=noheartsHTML();
  else{if(view==='badges')h=badgesHTML()+navbar();else if(view==='profile')h=profileHTML()+navbar();else{view='home';h=homeHTML()+navbar();}}
  if(cheat)h+=cheatHTML();
  app.innerHTML=h;
  if(view==='home'&&scrollCur&&!cheat){scrollCur=false;var cn=document.querySelector('.node.cur');if(cn&&cn.scrollIntoView)cn.scrollIntoView({block:'center'});}
  if(view==='lesson'&&L){L.fresh=false;if(L.focusNext&&cur().type==='type'&&!L.status){var a=$('#ans');if(a)try{a.focus({preventScroll:true});}catch(e){}}L.focusNext=false;}
}

/* ---------- nowy materiał ze zdjęcia (tylko tam, gdzie jest dostęp do Claude) ---------- */
var SAMPLE=null,PHOTO_OK=false,photo={busy:false,msg:'',json:''},photoCtl=null;
try{if(typeof claude!=='undefined'&&claude&&claude.use){claude.use('sample').then(function(s){if(!s)return;SAMPLE=s;return s.limits().then(function(l){if(l&&l.images){PHOTO_OK=true;if(view==='home')render();}});}).catch(function(){});}}catch(e){}
function photoCard(){
  if(!PHOTO_OK)return '';
  var h='<section class="card" style="margin-bottom:12px"><h3 style="margin:0 0 6px">Nowy materiał ze zdjęcia</h3><p class="muted" style="font-size:14px;margin:0 0 10px">Zrób zdjęcie strony z książki lub zeszytu (może być kilka). Claude przygotuje z niej ćwiczenia: pytania A–D i test literowy. Pojawią się w zakładce „Własne”.</p>';
  if(photo.busy)h+='<p class="msg">Claude czyta zdjęcie i układa ćwiczenia… to może potrwać do minuty.</p><div class="row"><button class="btn ghost small" data-act="photostop">Przerwij</button></div>';
  else h+='<label class="btn" for="photoin" style="display:inline-block;cursor:pointer">Zrób zdjęcie / wybierz plik</label><input id="photoin" type="file" accept="image/*" capture="environment" multiple hidden>';
  if(photo.msg)h+='<p class="msg">'+esc(photo.msg)+'</p>';
  if(photo.json&&!photo.busy)h+='<div class="row" style="margin-top:8px"><button class="btn ghost small" data-act="photocopy">Kopiuj ćwiczenia dla Konrada</button></div><p class="muted" style="font-size:13px">Na telefonie Konrada wklej je w profilu, w polu „Dodaj własne pytania”.</p>';
  return h+'</section>';
}
function photoMake(files){
  if(!SAMPLE||!files||!files.length)return;
  photo.busy=true;photo.msg='';photo.json='';photoCtl=new AbortController();render();
  var prompt='Na zdjęciach jest materiał do nauki angielskiego (np. strona z podręcznika, tekst, lista słówek, ćwiczenia) dla ucznia 7–8 klasy, który przygotowuje się do olimpiady z angielskiego. '+
  'Na podstawie WYŁĄCZNIE tego materiału ułóż 12 ćwiczeń z luką. Każde ćwiczenie to zdanie po angielsku, w którym brakuje jednego słowa (lub fragmentu bez spacji, np. phrasal verb jako jedno słowo — jeśli się nie da, wybierz inne słowo). '+
  'Zdanie weź z materiału albo ułóż podobne, w poziomie ucznia. Zwróć WYŁĄCZNIE tablicę JSON, bez żadnego innego tekstu, obiektów w formacie: '+
  '{"q":"zdanie z luką oznaczoną ____ (cztery podkreślenia)","answer":"poprawne słowo","wrong":["zły1","zły2","zły3"],"explain":"krótkie wyjaśnienie po polsku, np. tłumaczenie lub reguła"}. '+
  'Złe opcje mają być wiarygodne, ale na pewno niepoprawne w tym zdaniu. Jeśli zdjęcie jest nieczytelne albo nie zawiera materiału do nauki, zwróć pustą tablicę [].';
  SAMPLE.json(prompt,{images:Array.prototype.slice.call(files,0,4),modelTier:'default',signal:photoCtl.signal,cache:false}).then(function(arr){
    if(!Array.isArray(arr))throw {code:'bad'};
    var items=arr.filter(function(x){return x&&typeof x.q==='string'&&x.q.indexOf('____')>=0&&typeof x.answer==='string'&&x.answer&&Array.isArray(x.wrong)&&x.wrong.length>=2;}).map(function(x){var w=x.wrong.map(String).filter(function(y,i,a){return y&&y.toLowerCase()!==x.answer.toLowerCase()&&a.indexOf(y)===i;}).slice(0,3);return w.length>=2?{q:x.q,a:x.answer,w:w,e:String(x.explain||'')}:null;}).filter(Boolean);
    if(!items.length){photo.busy=false;photo.msg='Nie udało się ułożyć ćwiczeń z tego zdjęcia. Spróbuj zrobić je ostrzej i bliżej.';render();return;}
    var id='foto'+Date.now().toString(36),d=new Date(),title='Nowy materiał '+d.getDate()+'.'+('0'+(d.getMonth()+1)).slice(-2)+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2),qs=[],per=4;
    for(var s=0;s<items.length;s+=per){var g=items.slice(s,s+per);
      g.forEach(function(x,i){qs.push({id:id+'a'+(s+i),unit:id,type:'mc',q:x.q,options:[x.a].concat(x.w),answer:0,explain:x.e});});
      g.forEach(function(x,i){qs.push({id:id+'l'+(s+i),unit:id,type:'type',q:x.q,answers:[x.a],phase:'Test literowy',explain:x.e});});}
    var obj={units:[{id:id,title:title,desc:'Ćwiczenia ze zdjęcia: pytania A–D i test literowy',size:2*per,shuffle:false}],questions:qs};
    addCustom(JSON.stringify(obj));S.stage='wlasne';save();
    photo.busy=false;photo.json=JSON.stringify(obj);photo.msg='Gotowe: '+items.length+' ćwiczeń. Znajdziesz je w zakładce „Własne”.';render();
  }).catch(function(e){photo.busy=false;var c=e&&e.code;photo.msg=c==='cancelled'?'':c==='not_granted'?'Nie zezwolono na użycie Claude w tej aplikacji.':c==='rate_limited'?'Za dużo zapytań. Spróbuj za chwilę.':c==='image_rejected'?'To zdjęcie nie może zostać użyte. Wybierz inne.':'Nie udało się. Spróbuj jeszcze raz.';render();});
}
document.addEventListener('change',function(e){if(e.target&&e.target.id==='photoin'){var f=e.target.files;if(f&&f.length)photoMake(f);}});

/* ---------- własne pytania ---------- */
function addCustom(txt){
  var o;try{o=JSON.parse(txt);}catch(e){return 'To nie jest poprawny JSON. Sprawdź, czy skopiowano cały plik.';}
  var qs=Array.isArray(o)?o:(o.questions||[]),us=Array.isArray(o)?[]:(o.units||[]),ps=Array.isArray(o)?{}:(o.passages||{});
  if(!qs.length)return 'Nie znaleziono pytań (pole "questions").';
  var have={};allQ().forEach(function(q){have[q.id]=1;});var added=0,bad=0,stamp=Date.now().toString(36);
  us.forEach(function(u){if(u&&u.id&&u.title&&!units().some(function(x){return x.id===u.id;}))S.custom.units.push({id:String(u.id),title:String(u.title),desc:String(u.desc||''),size:u.size||6,shuffle:u.shuffle});});
  for(var k in ps)S.custom.passages[k]=ps[k];
  qs.forEach(function(q,n){
    if(!q||!q.unit||!q.type||!q.q){bad++;return;}
    q=JSON.parse(JSON.stringify(q));q.unit=String(q.unit);
    var okq=false;
    if(q.type==='mc')okq=Array.isArray(q.options)&&q.options.length>=2&&Number.isInteger(q.answer)&&q.answer>=0&&q.answer<q.options.length;
    else if(q.type==='type'){if(typeof q.answer==='string'&&!q.answers)q.answers=[q.answer];okq=Array.isArray(q.answers)&&q.answers.length>0;}
    else if(q.type==='order'){if(typeof q.answer==='string'&&!q.words)q.words=q.answer.split(' ');okq=typeof q.answer==='string'&&Array.isArray(q.words);}
    else if(q.type==='match')okq=Array.isArray(q.pairs)&&q.pairs.length>=2;
    if(!okq){bad++;return;}
    if(!units().some(function(x){return x.id===q.unit;}))S.custom.units.push({id:q.unit,title:q.unit,desc:'Własne pytania',size:6});
    if(!q.id||have[q.id])q.id='c'+stamp+'_'+n;
    have[q.id]=1;S.custom.questions.push(q);added++;
  });
  save();return 'Dodano pytań: '+added+(bad?'. Pominięto błędnych: '+bad:'')+'.';
}

/* ---------- zdarzenia ---------- */
document.addEventListener('click',function(e){
  if(cheat&&e.target.classList&&e.target.classList.contains('scrim')){cheat=null;render();return;}
  var t=e.target.closest('[data-act]');if(!t)return;var a=t.dataset.act,d=t.dataset,q;
  switch(a){
    case 'jump':var ju=document.getElementById('u-'+d.u);if(ju&&ju.scrollIntoView)ju.scrollIntoView({behavior:'smooth',block:'start'});break;
    case 'nav':view=d.v;pmsg='';resetArm=false;scrollCur=(d.v==='home');render();window.scrollTo(0,0);break;
    case 'stage':S.stage=d.s;save();scrollCur=true;render();break;
    case 'cheat':cheat=d.u||cur().unit;render();break;
    case 'cheatclose':cheat=null;render();break;
    case 'start':startLesson(d.u,+d.i);break;
    case 'locked':toast('Najpierw ukończ poprzednią lekcję');beep(SND.bad);break;
    case 'review':startReview();break;
    case 'done':view='home';R=null;scrollCur=true;render();window.scrollTo(0,0);break;
    case 'quit':L.quit=true;render();break;
    case 'qstay':L.quit=false;render();break;
    case 'qgo':L=null;view='home';scrollCur=true;render();break;
    case 'ptoggle':L.pOpen=!L.pOpen;render();break;
    case 'pick':if(L.status||L.ans==='say')return;L.cur.sel=+d.k;beep(SND.tap);render();break;
    case 'wpick':if(L.status||L.ans==='say')return;if(L.cur.chosen.indexOf(+d.w)<0)L.cur.chosen.push(+d.w);beep(SND.tap);render();break;
    case 'wun':if(L.status)return;L.cur.chosen=L.cur.chosen.filter(function(x){return x!==+d.w;});render();break;
    case 'answ':L.ans=d.m==='say'?'say':'write';L.choose=false;S.ansMode=L.ans;save();loadQ();render();window.scrollTo(0,0);break;
    case 'say':sayStart(true);break;
    case 'sayoff':sayStop();L.cur.say=null;render();break;
    case 'sayshow':L.cur.say.show=true;render();break;
    case 'sayok':if(cur().type==='match')L.cur.done=cur().pairs.map(function(_,i){return i;});resolve(true,false);break;
    case 'saybad':resolve(false,false);break;
    case 'ml':matchTap('l',+d.p);break;
    case 'mr':matchTap('r',+d.p);break;
    case 'check':if(canCheck())check();break;
    case 'skip':if(!L.status)resolve(false,true);break;
    case 'next':next();break;
    case 'goal':S.goal=+d.g;save();render();break;
    case 'sound':S.sound=d.s==='1';save();render();if(S.sound)beep(SND.ok);break;
    case 'gate':if(+($('#gate').value)===GA*GB){parentOk=true;pmsg='';}else pmsg='Spróbuj jeszcze raz.';render();break;
    case 'pclose':parentOk=false;pmsg='';GA=6+Math.floor(Math.random()*4);GB=6+Math.floor(Math.random()*4);render();break;
    case 'photostop':if(photoCtl)photoCtl.abort();break;
    case 'photocopy':try{navigator.clipboard.writeText(photo.json).then(function(){toast('Skopiowano');},function(){toast('Nie udało się skopiować');});}catch(_){toast('Nie udało się skopiować');}break;
    case 'padd':pmsg=addCustom($('#cjson').value);render();break;
    case 'pclear':S.custom={units:[],questions:[],passages:{}};S.mistakes=S.mistakes.filter(qById);save();pmsg='Usunięto własne pytania.';render();break;
    case 'pcopy':var ta=$('#bk');ta.select();try{navigator.clipboard.writeText(ta.value).then(function(){toast('Skopiowano');},function(){try{document.execCommand('copy');toast('Skopiowano');}catch(_){}});}catch(_){try{document.execCommand('copy');toast('Skopiowano');}catch(__){}}break;
    case 'pimport':try{var o=JSON.parse(decodeURIComponent(escape(atob($('#bki').value.trim()))));if(typeof o.xp!=='number')throw 0;var nd=def();for(var k in o)nd[k]=o[k];if(!nd.custom.passages)nd.custom.passages={};S=nd;save();pmsg='Postępy przywrócone.';}catch(_){pmsg='Nieprawidłowy kod kopii.';}render();break;
    case 'preset':if(!resetArm){resetArm=true;}else{var c=S.custom;S=def();S.custom=c;save();resetArm=false;pmsg='Postępy wyzerowane.';}render();break;
  }
});
document.addEventListener('input',function(e){if(e.target.id==='ans'&&L&&L.cur){L.cur.val=e.target.value;var b=document.querySelector('[data-act="check"]');if(b)b.disabled=!canCheck();}});
document.addEventListener('keydown',function(e){
  if(view!=='lesson'||!L||cheat)return;
  if(L.choose)return;
  if(e.key==='Enter'){if(L.status)next();else if(canCheck())check();return;}
  if(!L.status&&L.ans!=='say'&&!L.choose&&cur().type==='mc'&&/^[1-9]$/.test(e.key)&&+e.key<=L.cur.opts.length){L.cur.sel=+e.key-1;render();}
});
setInterval(function(){if(view==='nohearts'){tickHearts();var el=$('#hl');if(el)el.textContent=mmss(nextHeartMs());if(S.hearts>0){save();view='home';render();}}},1000);
rollDaily();tickHearts();render();
})();
</script>
