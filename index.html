<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2B4FD8"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="icon" type="image/png" href="icons/icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Olimp English"><meta name="apple-mobile-web-app-status-bar-style" content="default"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style><title>Olimp English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: jedna wąska kolumna jak aplikacja mobilna; ścieżka lekcji w zygzaku, medale jako nagrody */
:root{
  --bg:#F3F5FA;--surface:#FFFFFF;--surface2:#E8ECF5;--ink:#15203B;--muted:#5C6884;--line:#D5DBEA;
  --brand:#2B4FD8;--brand-sh:#1B3697;--brand-soft:#E4EAFF;
  --gold:#F0A800;--gold-sh:#B27D00;--gold-soft:#FFF0C4;
  --ok:#1E9E5A;--ok-sh:#157545;--ok-soft:#DCF4E7;--ok-ink:#0F6B3B;
  --bad:#D6404A;--bad-sh:#A62B34;--bad-soft:#FDE2E4;--bad-ink:#A62B34;
  --flame:#F26A1B;--heart:#E5365B;
  --f-display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1426;--surface:#15203A;--surface2:#1F2C4D;--ink:#EEF2FF;--muted:#9AA8C7;--line:#2B3A5E;
  --brand:#4C68F2;--brand-sh:#2D45B8;--brand-soft:#1E2A57;
  --gold:#F5B82E;--gold-sh:#B88510;--gold-soft:#3A3012;
  --ok:#3CCB84;--ok-sh:#1F8F58;--ok-soft:#10382A;--ok-ink:#7BE0AB;
  --bad:#FF6B73;--bad-sh:#B8434A;--bad-soft:#40181D;--bad-ink:#FF9AA0;
  --flame:#FF8440;--heart:#FF5C80;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1426;--surface:#15203A;--surface2:#1F2C4D;--ink:#EEF2FF;--muted:#9AA8C7;--line:#2B3A5E;
  --brand:#4C68F2;--brand-sh:#2D45B8;--brand-soft:#1E2A57;
  --gold:#F5B82E;--gold-sh:#B88510;--gold-soft:#3A3012;
  --ok:#3CCB84;--ok-sh:#1F8F58;--ok-soft:#10382A;--ok-ink:#7BE0AB;
  --bad:#FF6B73;--bad-sh:#B8434A;--bad-soft:#40181D;--bad-ink:#FF9AA0;
  --flame:#FF8440;--heart:#FF5C80;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--f-display);margin:0;font-weight:600;text-wrap:balance}
p{margin:0}
.app{max-width:480px;margin:0 auto;padding-bottom:110px;min-width:0}
.i{flex:none;display:block}
.muted{color:var(--muted)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 0}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:600;font-size:19px}
.brand .mk{width:32px;height:32px;border-radius:10px;background:var(--gold);color:#3b2a00;display:grid;place-items:center}
.chips{display:flex;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-display);font-weight:600;font-size:16px;padding:5px 9px;border-radius:12px;background:var(--surface);border:2px solid var(--line)}
.chip.flame{color:var(--flame)}.chip.bolt{color:var(--gold-sh)}.chip.heart{color:var(--heart)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.bolt{color:var(--gold)}}
:root[data-theme="dark"] .chip.bolt{color:var(--gold)}

/* cards */
.card{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;min-width:0}
.card h3{font-size:19px;margin-bottom:8px}
.hero{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hero h2{font-size:22px}
.hero .sub{color:var(--muted);font-size:14px;margin-top:2px}
.lv{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;font-weight:700;color:var(--muted)}
.bar{flex:1;height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--gold);border-radius:99px}
.ring{flex:none}.ring .rb{fill:none;stroke:var(--surface2);stroke-width:7}
.ring .rf{fill:none;stroke:var(--gold);stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring .rt{font-family:var(--f-display);font-weight:600;font-size:13px;fill:var(--ink)}
.review{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--bad-soft);border:2px solid var(--bad);border-radius:18px;padding:12px 14px;margin-bottom:14px;color:var(--ink)}
.review b{font-family:var(--f-display);font-size:17px;display:block}
.review span{font-size:13px;color:var(--muted)}

/* path */
.unit{margin-top:22px}
.ubanner{background:var(--uc);color:#fff;border-radius:18px;padding:14px 16px;box-shadow:0 5px 0 var(--ucs)}
.ubanner h2{font-size:21px}.ubanner p{font-size:14px;opacity:.92}
.ubanner .pg{margin-top:6px;font-size:13px;font-weight:700;opacity:.95}
.step{display:flex;flex-direction:column;align-items:center;margin:16px 0 6px;transform:translateX(var(--x));position:relative}
.node{width:74px;height:74px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--uc);color:#fff;box-shadow:0 7px 0 var(--ucs);transition:transform .08s}
.node:active{transform:translateY(4px);box-shadow:0 3px 0 var(--ucs)}
.node.done{background:var(--gold);box-shadow:0 7px 0 var(--gold-sh);color:#3b2a00}
.node.locked{background:var(--surface2);box-shadow:0 7px 0 var(--line);color:var(--muted)}
.node.cur{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{outline:0 solid transparent}50%{outline:8px solid color-mix(in srgb,var(--uc) 28%,transparent)}}
.bubble{position:absolute;top:-30px;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:2px 10px;font-family:var(--f-display);font-weight:600;font-size:13px;color:var(--ink);letter-spacing:.06em}
.nl{font-size:12px;font-weight:700;color:var(--muted);margin-top:10px}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:2px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.nav>div{max-width:480px;margin:auto;display:flex;gap:6px}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border:2px solid transparent;border-radius:14px;background:none;color:var(--muted);font-size:12px;font-weight:700}
.nav button.on{color:var(--brand);background:var(--brand-soft);border-color:var(--brand)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .nav button.on{color:#B9C6FF}}
:root[data-theme="dark"] .nav button.on{color:#B9C6FF}

/* buttons */
.btn{border:0;border-radius:16px;padding:14px 20px;background:var(--brand);color:#fff;font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.04em;text-transform:uppercase;box-shadow:0 5px 0 var(--brand-sh);transition:transform .08s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 var(--brand-sh)}
.btn:disabled{background:var(--surface2);color:var(--muted);box-shadow:0 5px 0 var(--line);cursor:not-allowed}
.btn.okbtn{background:var(--ok);box-shadow:0 5px 0 var(--ok-sh)}
.btn.badbtn{background:var(--bad);box-shadow:0 5px 0 var(--bad-sh)}
.btn.gold{background:var(--gold);color:#3b2a00;box-shadow:0 5px 0 var(--gold-sh)}
.btn.ghost{background:transparent;color:var(--muted);box-shadow:none;border:2px solid var(--line);padding:12px 16px;font-size:15px}
.btn.small{padding:10px 14px;font-size:14px}
.icon-btn{background:none;border:0;padding:6px;color:var(--muted);border-radius:10px;display:grid;place-items:center}

/* lesson */
.lesson{max-width:480px;margin:0 auto;min-width:0}
.lbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 0}
.progress{flex:1;height:14px;border-radius:99px;background:var(--surface2);overflow:hidden}
.progress>i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .35s}
.lbody{padding:10px 0 240px}
.kicker{font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.qtext{font-size:25px;line-height:1.3;margin-bottom:6px;overflow-wrap:anywhere}
.blank{display:inline-block;min-width:64px;border-bottom:4px solid var(--brand);margin:0 4px;transform:translateY(3px)}
.hint{color:var(--muted);font-size:15px;margin-bottom:6px}
.enter{animation:enter .28s ease-out}
@keyframes enter{from{opacity:.2;transform:translateX(18px)}to{opacity:1;transform:none}}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;background:var(--surface);color:var(--ink);font-weight:600;font-size:17px;overflow-wrap:anywhere}
.opt .key{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--muted)}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.sel .key{border-color:var(--brand);color:var(--brand)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.field{width:100%;padding:14px 16px;border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;background:var(--surface);color:var(--ink);font:600 20px var(--f-body);margin-top:18px}
.field:focus{outline:none;border-color:var(--brand)}
.field.okf{border-color:var(--ok);background:var(--ok-soft)}.field.badf{border-color:var(--bad);background:var(--bad-soft)}
.passage{background:var(--surface);border:2px solid var(--line);border-radius:16px;margin-bottom:16px;overflow:hidden}
.passage button{display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--gold-soft);border:0;padding:10px 14px;font-family:var(--f-display);font-weight:600;font-size:15px;text-align:left}
.passage .tx{padding:12px 14px;font-size:16px;line-height:1.55;max-height:38vh;overflow:auto}
.slots{min-height:64px;margin-top:18px;border-bottom:2px solid var(--line);padding-bottom:10px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;min-height:60px}
.wc{padding:10px 14px;border:2px solid var(--line);border-bottom-width:5px;border-radius:14px;background:var(--surface);color:var(--ink);font-weight:700;font-size:17px}
.wc.used{visibility:hidden}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.mcol{display:flex;flex-direction:column;gap:10px;min-width:0}
.mb{padding:12px 10px;border:2px solid var(--line);border-bottom-width:5px;border-radius:14px;background:var(--surface);color:var(--ink);font-weight:700;font-size:15px;min-height:56px;overflow-wrap:anywhere}
.mb.sel{border-color:var(--brand);background:var(--brand-soft)}
.mb.okm{border-color:var(--ok);background:var(--ok-soft);color:var(--ok-ink);opacity:.75}
.mb.fl{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:2px solid var(--line);
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.foot.ok{background:var(--ok-soft);border-color:var(--ok)}.foot.bad{background:var(--bad-soft);border-color:var(--bad)}
.fin{max-width:480px;margin:auto;display:flex;gap:12px;align-items:center;justify-content:space-between}
.fin .btn:not(.ghost){flex:1}
.foot.ok .fin,.foot.bad .fin{flex-direction:column;align-items:stretch;gap:12px}
.fb strong{font-family:var(--f-display);font-size:22px;display:block}
.foot.ok .fb{color:var(--ok-ink)}.foot.bad .fb{color:var(--bad-ink)}
.fb p{font-size:15px;color:var(--ink);margin-top:4px;overflow-wrap:anywhere}
.fb p.ex{color:var(--muted)}
.scrim{position:fixed;inset:0;background:rgba(5,10,25,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{width:100%;max-width:480px;background:var(--surface);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:12px}
.sheet h3{font-size:22px}

/* result */
.res{max-width:480px;margin:0 auto;padding:36px 0 40px;text-align:center}
.medal{width:132px;height:132px;border-radius:50%;margin:0 auto 18px;background:var(--gold);color:#3b2a00;display:grid;place-items:center;box-shadow:0 8px 0 var(--gold-sh);animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.4)}to{transform:scale(1)}}
.res h1{font-size:30px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}
.tile{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 6px}
.tile b{display:block;font-family:var(--f-display);font-size:26px;line-height:1.1}
.tile span{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.banner{border-radius:16px;padding:12px 14px;margin-bottom:12px;font-weight:700;text-align:left;display:flex;gap:12px;align-items:center}
.banner.lvup{background:var(--gold-soft);border:2px solid var(--gold)}
.banner.bdg{background:var(--brand-soft);border:2px solid var(--brand)}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30}
.confetti i{position:absolute;top:-16px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* badges / profile */
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.bd{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px 10px;text-align:center;min-width:0}
.bd .bi{width:60px;height:60px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;background:var(--bc);color:#fff}
.bd.lock{opacity:.55}.bd.lock .bi{background:var(--surface2);color:var(--muted)}
.bd b{display:block;font-family:var(--f-display);font-size:15px;line-height:1.2}
.bd span{font-size:12px;color:var(--muted)}
h2.sec{font-size:22px;margin:6px 0 12px}
.ladder{display:flex;flex-direction:column;gap:6px}
.lr{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;font-weight:700;color:var(--muted)}
.lr.on{background:var(--gold-soft);color:var(--ink);border:2px solid var(--gold)}
.lr.past{color:var(--ink)}
.lr small{margin-left:auto;font-weight:600}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.seg{display:flex;gap:6px}
.seg button{padding:8px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:700}
.seg button.on{border-color:var(--brand);background:var(--brand-soft)}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
textarea{width:100%;min-height:110px;padding:10px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
pre{background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:10px;overflow-x:auto;font-size:12px;margin:8px 0}
details summary{cursor:pointer;font-weight:700;margin:8px 0}
.msg{font-size:14px;font-weight:700;margin-top:8px;color:var(--brand)}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:700;max-width:90vw;text-align:center}
/* stages + cheat sheet */
.stages{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none}
.stages::-webkit-scrollbar{display:none}
.stages button{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:0;padding:8px 14px;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;background:var(--surface);color:var(--ink);font-family:var(--f-display);font-weight:600;font-size:15px;line-height:1.2}
.stages button small{font-family:var(--f-body);font-weight:700;font-size:11px;color:var(--muted)}
.stages button.on{border-color:var(--brand);background:var(--brand-soft)}
.uh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.uh>div:first-child{min-width:0}
.ubtn{display:flex;flex-direction:column;gap:6px;align-items:stretch;flex:none}
.ubtn button,.ubtn a{display:flex;align-items:center;gap:6px;justify-content:center;background:rgba(255,255,255,.2);color:#fff;border:2px solid rgba(255,255,255,.55);border-radius:12px;padding:5px 10px;font-weight:700;font-size:13px;text-decoration:none;white-space:nowrap}
.sheet.cheat{max-height:82vh;overflow:auto}
.ck{background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.ck b{font-family:var(--f-display);font-size:17px;display:block}
.ck p{font-size:15px;margin-top:2px}
.ck .ex{margin-top:6px;background:var(--gold-soft);border-radius:10px;padding:6px 10px;font-weight:700;font-size:15px}
.plink{display:inline-block;margin-top:8px;font-weight:700;color:var(--brand)}
.cheer{display:inline-block;background:var(--gold-soft);border:2px solid var(--gold);color:var(--ink);border-radius:12px;padding:4px 12px;font-family:var(--f-display);font-weight:600;font-size:15px;margin-bottom:10px;animation:enter .3s ease-out}
.banner.praise{background:var(--ok-soft);border:2px solid var(--ok)}
.banner.fire{background:var(--gold-soft);border:2px solid var(--flame)}
.praisep{font-size:18px;font-weight:700;margin-top:8px}
.nextb{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.nextb .bi{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--bc);color:#fff;flex:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

<script type="application/json" id="bank">{"units":[{"id":"g01","stage":"szkolny","title":"1. not mind · would prefer to · would rather","desc":"Etap szkolny, temat 1","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"don’t mind + -ing","t":"Nie mam nic przeciwko. Po mind użyj -ing.","ex":"I don’t mind waiting."},{"h":"would prefer to + verb","t":"Wolałbym: po prefer użyj to + bezokolicznik.","ex":"I’d prefer to stay."},{"h":"would rather + verb","t":"Wolałbym: po rather użyj formy bez to.","ex":"I’d rather stay."}]},{"id":"g02","stage":"szkolny","title":"2. so · such","desc":"Etap szkolny, temat 2","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"so + przymiotnik","t":"So stoi przed samym przymiotnikiem lub przysłówkiem.","ex":"It was so cold."},{"h":"such + (a/an) + rzeczownik","t":"Such odnosi się do grupy z rzeczownikiem.","ex":"It was such a cold day."},{"h":"Skutek","t":"Obie formy mogą łączyć się z that.","ex":"It was so late that we left."}]},{"id":"g03","stage":"szkolny","title":"3. ought to · need to · needn’t","desc":"Etap szkolny, temat 3","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"ought to","t":"Rada lub powinność: ought to + bezokolicznik.","ex":"You ought to rest."},{"h":"need to","t":"Konieczność: need to + bezokolicznik.","ex":"I need to study."},{"h":"needn’t","t":"Brak konieczności, nie zakaz. Po needn’t forma bez to.","ex":"You needn’t hurry."}]},{"id":"g04","stage":"szkolny","title":"4. used to","desc":"Etap szkolny, temat 4","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"used to + verb","t":"Dawny zwyczaj lub stan, który już nie jest aktualny.","ex":"I used to play chess."},{"h":"Przeczenie","t":"Po didn’t wraca podstawowa forma use.","ex":"I didn’t use to smoke."},{"h":"Pytanie","t":"Did + podmiot + use to + czasownik.","ex":"Did you use to live here?"}]},{"id":"g05","stage":"szkolny","title":"5. Strona bierna: Present Perfect i Future Simple","desc":"Etap szkolny, temat 5","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"Present Perfect passive","t":"have/has been + III forma czasownika.","ex":"The room has been cleaned."},{"h":"Future Simple passive","t":"will be + III forma czasownika.","ex":"The room will be cleaned."},{"h":"Ważny jest rezultat","t":"W stronie biernej podmiot otrzymuje działanie.","ex":"The letters have been sent."}]},{"id":"g06","stage":"szkolny","title":"6. Czasowniki złożone (phrasal verbs)","desc":"Etap szkolny, temat 6","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"Czasownik + cząstka","t":"Cząstka może zmienić sens czasownika.","ex":"give up = zrezygnować"},{"h":"Ucz się w kontekście","t":"Podobne czasowniki z inną cząstką mają różne znaczenia.","ex":"look after = opiekować się"},{"h":"Dopełnienie","t":"Niektóre są rozdzielne: turn it off.","ex":"Turn off the light. / Turn it off."}]},{"id":"g07","stage":"szkolny","title":"7. Mowa zależna: say · tell · ask","desc":"Etap szkolny, temat 7","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"Zdania oznajmujące","t":"Say (that) + zdanie; tell + osoba + (that).","ex":"She told me she was tired."},{"h":"Polecenia","t":"Tell/ask + osoba + to + czasownik.","ex":"He told us to wait."},{"h":"Pytania i zakazy","t":"Ask if/wh-; zakaz: not to + czasownik.","ex":"She asked if I was ready."}]},{"id":"g08","stage":"szkolny","title":"8. Zdania przydawkowe definiujące i wtrącone","desc":"Etap szkolny, temat 8","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"Definiujące","t":"Dają niezbędną informację; bez przecinków.","ex":"The girl who won is here."},{"h":"Wtrącone","t":"Dodają informację; oddzielamy przecinkami.","ex":"Anna, who lives here, is kind."},{"h":"Zaimki","t":"Who dla osób, which dla rzeczy; that tylko w definiujących.","ex":"The book which I bought is new."}]},{"id":"g09","stage":"szkolny","title":"9. Rzeczowniki złożone i słowotwórstwo","desc":"Etap szkolny, temat 9","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"Rzeczownik złożony","t":"Dwa wyrazy mogą tworzyć jedną nazwę.","ex":"toothbrush = szczoteczka do zębów"},{"h":"Od czasownika","t":"Często dodajemy -er/-or lub -ment.","ex":"teach → teacher; develop → development"},{"h":"Od przymiotnika","t":"Często dodajemy -ness lub -ity.","ex":"happy → happiness; active → activity"}]},{"id":"g10","stage":"szkolny","title":"10. Zaimki nieokreślone","desc":"Etap szkolny, temat 10","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"Some- i any-","t":"Some zwykle w twierdzeniach, any zwykle w pytaniach i przeczeniach.","ex":"Someone is here. / Is anyone here?"},{"h":"No- i every-","t":"Nobody = nikt; everybody = wszyscy.","ex":"Nobody knows."},{"h":"Liczba pojedyncza","t":"Someone, nobody, everything łączą się z czasownikiem w liczbie pojedynczej.","ex":"Everybody is ready."}]},{"id":"g11","stage":"szkolny","title":"11. Szyk przymiotników","desc":"Etap szkolny, temat 11","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"Opinia przed faktem","t":"Najpierw subiektywna ocena, potem cechy opisowe.","ex":"a beautiful old house"},{"h":"Typowa kolejność","t":"Opinia → wielkość → wiek → kolor → pochodzenie → materiał.","ex":"a small old red Italian car"},{"h":"Bez przecinka","t":"Przymiotniki różnych kategorii zwykle stoją obok siebie.","ex":"a lovely little dog"}]},{"id":"g12","stage":"szkolny","title":"12. Przymiotniki o znaczeniu przeciwstawnym","desc":"Etap szkolny, temat 12","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"Przedrostki","t":"Un-, in-, im-, il-, ir-, dis- mogą odwracać znaczenie.","ex":"happy → unhappy"},{"h":"Dobór przedrostka","t":"Im- przed p/b/m; il- przed l; ir- przed r.","ex":"possible → impossible"},{"h":"Uważaj na pisownię","t":"Nie każdy przymiotnik przyjmuje un-.","ex":"regular → irregular"}]},{"id":"g13","stage":"szkolny","title":"13. yet · for · since · just","desc":"Etap szkolny, temat 13","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"yet","t":"Jeszcze / już; zwykle w pytaniu lub przeczeniu, na końcu zdania.","ex":"Have you finished yet?"},{"h":"for i since","t":"For + okres; since + moment rozpoczęcia.","ex":"for two years; since 2022"},{"h":"just","t":"Właśnie; często przed III formą w Present Perfect.","ex":"I have just arrived."}]},{"id":"g14","stage":"szkolny","title":"14. Stopniowanie przysłówków","desc":"Etap szkolny, temat 14","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"Regularnie","t":"Krótkie: -er/-est; wiele zakończonych na -ly: more/most.","ex":"fast → faster → fastest"},{"h":"Nieregularnie","t":"Well → better → best; badly → worse → worst.","ex":"She sings better than I do."},{"h":"Porównanie","t":"W stopniu wyższym zwykle używamy than.","ex":"He runs more quickly than me."}]},{"id":"g15","stage":"szkolny","title":"15. Spójniki i wyrażenia kontrastu","desc":"Etap szkolny, temat 15","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"as soon as · unless","t":"As soon as = gdy tylko; unless = jeśli nie.","ex":"Call me as soon as you arrive."},{"h":"although · however","t":"Although łączy części zdania; however zwykle rozpoczyna nowe zdanie.","ex":"Although it rained, we went out."},{"h":"despite · in spite of","t":"Po nich rzeczownik lub -ing, nie zwykłe zdanie.","ex":"Despite the rain, we went out."}]},{"id":"g16","stage":"szkolny","title":"16. Pytania z przyimkiem na końcu","desc":"Etap szkolny, temat 16","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"Naturalny szyk","t":"W zwykłym pytaniu przyimek może stać na końcu.","ex":"Who are you talking to?"},{"h":"Pytanie o rzecz","t":"Zachowaj przyimek wymagany przez czasownik.","ex":"What are you looking for?"},{"h":"Pytanie o miejsce","t":"Przyimek też może kończyć pytanie.","ex":"Which room did you go into?"}]},{"id":"g17","stage":"szkolny","title":"17. Przyimki kierunku i ruchu","desc":"Etap szkolny, temat 17","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"towards","t":"W stronę, bez koniecznego dotarcia do celu.","ex":"She walked towards the door."},{"h":"into · out of","t":"Ruch do środka i na zewnątrz.","ex":"He went into the room."},{"h":"across · through","t":"Across przez powierzchnię; through przez wnętrze.","ex":"across the road; through the tunnel"}]},{"id":"g18","stage":"szkolny","title":"18. Pytania pośrednie","desc":"Etap szkolny, temat 18","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"Szyk zdania","t":"Po zwrocie wprowadzającym zachowaj szyk oznajmujący.","ex":"Do you know where she lives?"},{"h":"Bez do/does/did","t":"Nie dodawaj operatora w części zależnej.","ex":"Can you tell me what he wants?"},{"h":"Pytania tak/nie","t":"Użyj if lub whether.","ex":"Do you know if he is here?"}]},{"id":"g19","stage":"szkolny","title":"19. II okres warunkowy","desc":"Etap szkolny, temat 19","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"Warunek","t":"If + Past Simple opisuje sytuację hipotetyczną.","ex":"If I had time, ..."},{"h":"Skutek","t":"Would + czasownik bez to.","ex":"... I would travel."},{"h":"Were","t":"W formalniejszym języku: If I were you.","ex":"If I were you, I’d ask."}]},{"id":"g20","stage":"szkolny","title":"20. Present Perfect Continuous · Future Continuous","desc":"Etap szkolny, temat 20","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"Present Perfect Continuous","t":"have/has been + -ing: czynność trwa od pewnego czasu.","ex":"I have been studying for two hours."},{"h":"Future Continuous","t":"will be + -ing: czynność będzie trwała w określonym momencie.","ex":"At eight, I will be studying."},{"h":"Wskazówki","t":"For/since zwykle naprowadza na pierwszy czas; at this time tomorrow na drugi.","ex":"She has been working since noon."}]},{"id":"g21","stage":"szkolny","title":"21. Question tags","desc":"Etap szkolny, temat 21","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"Przeciwna polaryzacja","t":"Po zdaniu twierdzącym zwykle tag przeczący.","ex":"She is here, isn’t she?"},{"h":"Odwrotnie","t":"Po zdaniu przeczącym tag twierdzący.","ex":"He isn’t ready, is he?"},{"h":"To samo orzeczenie","t":"Powtórz operator i odpowiedni zaimek.","ex":"They can swim, can’t they?"}]},{"id":"g22","stage":"szkolny","title":"22. Zaimki zwrotne i wzajemne","desc":"Etap szkolny, temat 22","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"Zwrotne","t":"Działanie wraca do wykonawcy: myself, yourself, himself itd.","ex":"He hurt himself."},{"h":"Wzajemne","t":"Each other / one another: ludzie działają wzajemnie.","ex":"They helped each other."},{"h":"Podkreślenie","t":"Zaimkiem zwrotnym można podkreślić samodzielność.","ex":"I made it myself."}]},{"id":"g23","stage":"szkolny","title":"23. be able to","desc":"Etap szkolny, temat 23","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"Umiejętność","t":"Be able to + forma podstawowa czasownika.","ex":"I am able to swim."},{"h":"Różne czasy","t":"Można używać tam, gdzie can nie ma potrzebnej formy.","ex":"I will be able to come."},{"h":"Dokonane osiągnięcie","t":"Was/were able to może wskazywać, że udało się coś zrobić.","ex":"She was able to escape."}]},{"id":"g24","stage":"szkolny","title":"24. Zdania współrzędnie złożone","desc":"Etap szkolny, temat 24","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"and · but · or","t":"Łączą równorzędne myśli: dodanie, kontrast, wybór.","ex":"I called, but she was out."},{"h":"so","t":"Pokazuje wynik.","ex":"It rained, so we stayed home."},{"h":"nor · yet","t":"Nor dodaje przeczenie; yet sygnalizuje kontrast.","ex":"He was tired, yet he continued."}]},{"id":"g25","stage":"rejonowy","title":"25. Past Perfect Continuous","desc":"Etap rejonowy, temat 25","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"Budowa","t":"had been + czasownik z -ing.","ex":"She had been waiting."},{"h":"Wcześniejsza czynność","t":"Czynność trwała przed innym wydarzeniem w przeszłości.","ex":"I had been studying before you arrived."},{"h":"Skutek","t":"Często tłumaczy widoczny w przeszłości rezultat.","ex":"He was tired because he had been running."}]},{"id":"g26","stage":"rejonowy","title":"26. III okres warunkowy","desc":"Etap rejonowy, temat 26","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"Warunek","t":"If + Past Perfect: sytuacja nie wydarzyła się w przeszłości.","ex":"If I had studied, ..."},{"h":"Skutek","t":"Would have + III forma.","ex":"... I would have passed."},{"h":"Znaczenie","t":"Rozważamy inny możliwy wynik przeszłości.","ex":"If she had left earlier, she would have caught it."}]},{"id":"g27","stage":"rejonowy","title":"27. Strona bierna we wszystkich czasach","desc":"Etap rejonowy, temat 27","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"Schemat","t":"Odpowiednia forma be + III forma czasownika.","ex":"The book is read."},{"h":"Czasy ciągłe","t":"is/was being + III forma.","ex":"The road is being repaired."},{"h":"Czasy perfect","t":"has/had been + III forma.","ex":"The letter had been sent."}]},{"id":"g28","stage":"rejonowy","title":"28. used to · would: dawne zwyczaje","desc":"Etap rejonowy, temat 28","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"used to","t":"Dawne nawyki oraz stany.","ex":"I used to live here."},{"h":"would","t":"Powtarzające się dawne czynności, zwykle w opowieści.","ex":"Every summer, we would swim."},{"h":"Ważna różnica","t":"Would w tym znaczeniu nie opisuje dawnych stanów.","ex":"I used to be shy."}]},{"id":"g29","stage":"rejonowy","title":"29. had better · it’s high time","desc":"Etap rejonowy, temat 29","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"had better","t":"Mocna rada: had better + forma bez to.","ex":"You’d better leave now."},{"h":"Przeczenie","t":"Had better not + czasownik.","ex":"You’d better not wait."},{"h":"it’s high time","t":"Czas najwyższy; po nim często Past Simple.","ex":"It’s high time we left."}]},{"id":"g30","stage":"rejonowy","title":"30. have/get something done","desc":"Etap rejonowy, temat 30","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"Usługa lub zlecenie","t":"Ktoś wykonuje czynność dla nas.","ex":"I had my hair cut."},{"h":"Schemat","t":"have/get + rzecz + III forma czasownika.","ex":"She got her phone repaired."},{"h":"Czas","t":"Odmieniamy have/get, a imiesłów pozostaje.","ex":"We will have the roof fixed."}]},{"id":"g31","stage":"rejonowy","title":"31. Mowa zależna z różnymi czasownikami","desc":"Etap rejonowy, temat 31","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"admit · deny","t":"Admit/deny + -ing przy przyznaniu lub zaprzeczeniu.","ex":"She admitted taking it."},{"h":"promise · offer","t":"Promise/offer + to + czasownik.","ex":"He promised to help."},{"h":"warn · advise","t":"Warn/advise + osoba + (not) to + czasownik.","ex":"She warned me not to go."}]},{"id":"g32","stage":"rejonowy","title":"32. Czasowniki modalne o przeszłości","desc":"Etap rejonowy, temat 32","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"must have","t":"Mocny wniosek o przeszłości.","ex":"He must have forgotten."},{"h":"might have","t":"Możliwość, brak pewności.","ex":"She might have missed the train."},{"h":"should have","t":"Niewykonana rada lub żal.","ex":"You should have called."}]},{"id":"g33","stage":"rejonowy","title":"33. be/get used to","desc":"Etap rejonowy, temat 33","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"be used to","t":"Być przyzwyczajonym do czegoś.","ex":"I am used to the noise."},{"h":"get used to","t":"Przyzwyczajać się, proces zmiany.","ex":"She is getting used to it."},{"h":"Po to: -ing","t":"To jest przyimkiem, więc po czasowniku używamy -ing.","ex":"I’m used to waking early."}]},{"id":"g34","stage":"rejonowy","title":"34. Imiesłowy czynne i bierne","desc":"Etap rejonowy, temat 34","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"Czynny współczesny","t":"-ing: czynność wykonywana przez podmiot.","ex":"Walking home, I saw Anna."},{"h":"Bierny","t":"III forma: podmiot odbiera działanie.","ex":"Built in 1900, the house is old."},{"h":"Uprzedni","t":"Having + III forma: czynność wcześniejsza.","ex":"Having finished, she left."}]},{"id":"g35","stage":"rejonowy","title":"35. Rzeczowniki tylko w liczbie pojedynczej","desc":"Etap rejonowy, temat 35","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"Niepoliczalne","t":"Information, advice, furniture zwykle bez -s.","ex":"The information is useful."},{"h":"Zgoda","t":"Czasownik w liczbie pojedynczej.","ex":"The news is good."},{"h":"Ilość","t":"A piece of advice/information zamiast an advice.","ex":"She gave me a piece of advice."}]},{"id":"g36","stage":"rejonowy","title":"36. Ułamki i liczby dziesiętne","desc":"Etap rejonowy, temat 36","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"Ułamki","t":"Licznik liczebnikiem głównym, mianownik często porządkowym.","ex":"one third; two thirds"},{"h":"Połówki i ćwiartki","t":"A half; a quarter; three quarters.","ex":"three quarters of a litre"},{"h":"Dziesiętne","t":"Kropka to point; cyfry po niej czytamy osobno.","ex":"3.14 = three point one four"}]},{"id":"g37","stage":"rejonowy","title":"37. Wykrzyknienia i zdania podrzędne","desc":"Etap rejonowy, temat 37","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"Wykrzyknienia","t":"What + (a/an) + rzeczownik; how + przymiotnik/przysłówek.","ex":"What a day! How beautiful!"},{"h":"Zdanie podrzędne","t":"Część zdania może pełnić funkcję podmiotu lub dopełnienia.","ex":"What she said surprised me."},{"h":"Okolicznik","t":"Because, although, when łączą zdanie z okolicznością.","ex":"I stayed because it rained."}]},{"id":"g38","stage":"rejonowy","title":"38. Bezokolicznik i gerundium","desc":"Etap rejonowy, temat 38","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"to + infinitive","t":"Po want, decide, hope zwykle to + czasownik.","ex":"I decided to go."},{"h":"-ing","t":"Po enjoy, avoid, mind: -ing.","ex":"She enjoys reading."},{"h":"Po przyimku","t":"Po przyimku użyj -ing.","ex":"He is good at swimming."}]},{"id":"g39","stage":"rejonowy","title":"39. Cleft sentences","desc":"Etap rejonowy, temat 39","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"It was ... that/who","t":"Wyróżnia część zdania.","ex":"It was Tom who called."},{"h":"What ... was","t":"Akcentuje informację po was.","ex":"What I need is a break."},{"h":"To samo znaczenie","t":"Zmienia nacisk, nie podstawowy fakt.","ex":"Anna found the key → It was Anna who found it."}]},{"id":"g40","stage":"rejonowy","title":"40. so am I · neither am I","desc":"Etap rejonowy, temat 40","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"So + operator + podmiot","t":"Zgoda ze zdaniem twierdzącym.","ex":"I am tired. So am I."},{"h":"Neither + operator + podmiot","t":"Zgoda ze zdaniem przeczącym.","ex":"I am not tired. Neither am I."},{"h":"Dopasuj operator","t":"Can → can; have → have; zwykły czasownik → do/does/did.","ex":"She likes it. So do I."}]},{"id":"g41","stage":"rejonowy","title":"41. Słowotwórstwo wieloetapowe","desc":"Etap rejonowy, temat 41","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"Przedrostek i przyrostek","t":"Można użyć więcej niż jednej cząstki.","ex":"happy → unhappy → unhappiness"},{"h":"Część mowy","t":"Sprawdź, czy zdanie wymaga rzeczownika, przymiotnika czy przysłówka.","ex":"care → careful → carefully"},{"h":"Pisownia","t":"Zwróć uwagę na zmiany litery, np. y → i.","ex":"happy → happiness"}]},{"id":"g42","stage":"wojewódzki","title":"42. Wyrażenia idiomatyczne","desc":"Etap wojewódzki, temat 42","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"Znaczenie całości","t":"Idiomu nie tłumaczymy dosłownie.","ex":"break the ice = przełamać pierwsze lody"},{"h":"Kontekst","t":"Sprawdź, czy wyrażenie pasuje do sytuacji.","ex":"a piece of cake = coś łatwego"},{"h":"Forma","t":"Zapamiętuj całe połączenie wyrazów.","ex":"once in a blue moon = bardzo rzadko"}]},{"id":"g43","stage":"wojewódzki","title":"43. Future Perfect · Future Perfect Continuous","desc":"Etap wojewódzki, temat 43","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"Future Perfect","t":"will have + III forma: coś będzie ukończone do wskazanego czasu.","ex":"By six, I will have finished."},{"h":"Future Perfect Continuous","t":"will have been + -ing: czynność będzie trwała określony czas.","ex":"By June, I will have been studying for a year."},{"h":"By + punkt czasu","t":"Częsty sygnał obu czasów.","ex":"by Friday; by the time you arrive"}]},{"id":"g44","stage":"wojewódzki","title":"44. Zdania warunkowe mieszane","desc":"Etap wojewódzki, temat 44","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"Przeszłość → teraźniejszość","t":"If + Past Perfect, would + czasownik: dawna przyczyna, dzisiejszy skutek.","ex":"If I had slept, I wouldn’t be tired now."},{"h":"Teraźniejszość → przeszłość","t":"If + Past Simple, would have + III forma.","ex":"If I were careful, I wouldn’t have lost it."},{"h":"Sygnały czasu","t":"Now i yesterday pomagają rozpoznać kierunek.","ex":"If she had left, she would be here now."}]},{"id":"g45","stage":"wojewódzki","title":"45. I wish · if only · suppose · I’d rather","desc":"Etap wojewódzki, temat 45","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"wish/if only + Past Simple","t":"Żal dotyczący teraźniejszości.","ex":"I wish I knew."},{"h":"wish/if only + Past Perfect","t":"Żal dotyczący przeszłości.","ex":"If only I had known."},{"h":"Wola co do innej osoby","t":"I’d rather + osoba + Past Simple.","ex":"I’d rather you stayed."}]},{"id":"g46","stage":"wojewódzki","title":"46. as if · as though","desc":"Etap wojewódzki, temat 46","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"Wygląd lub wrażenie","t":"As if/as though = jak gdyby.","ex":"He looks as if he is tired."},{"h":"Nierealność teraz","t":"Past Simple może pokazać, że wiemy, iż coś nie jest prawdą.","ex":"He talks as if he knew everything."},{"h":"Nierealność w przeszłości","t":"Past Perfect wskazuje wcześniejszą pozorną sytuację.","ex":"She acted as if she had seen a ghost."}]},{"id":"g47","stage":"wojewódzki","title":"47. Inwersja","desc":"Etap wojewódzki, temat 47","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"Negatywny wyraz na początku","t":"Po never, rarely, hardly następuje operator przed podmiotem.","ex":"Never have I seen this."},{"h":"Not only","t":"Not only + operator + podmiot + czasownik.","ex":"Not only did she sing, she danced."},{"h":"Warunkowa","t":"Bez if można użyć Had/Were/Should przed podmiotem.","ex":"Had I known, I would have helped."}]},{"id":"g48","stage":"wojewódzki","title":"48. either ... or · neither ... nor","desc":"Etap wojewódzki, temat 48","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"either ... or","t":"Jedna z dwóch możliwości.","ex":"Either tea or coffee is fine."},{"h":"neither ... nor","t":"Żadna z dwóch możliwości.","ex":"Neither Tom nor Anna came."},{"h":"Zgoda z bliższym podmiotem","t":"Czasownik często zgadza się z członem najbliższym.","ex":"Neither he nor his friends are here."}]},{"id":"g49","stage":"wojewódzki","title":"49. have somebody do · get somebody to do","desc":"Etap wojewódzki, temat 49","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"have + osoba + verb","t":"Sprawić, zlecić komuś czynność; bez to.","ex":"I had Tom fix the bike."},{"h":"get + osoba + to + verb","t":"Namówić lub doprowadzić do wykonania czynności.","ex":"I got Tom to fix the bike."},{"h":"Nie myl z usługą","t":"Have my bike fixed oznacza, że ktoś naprawił rower.","ex":"I had my bike fixed."}]},{"id":"g50","stage":"wojewódzki","title":"50. Emfatyczne do · does · did","desc":"Etap wojewódzki, temat 50","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"Wzmocnienie","t":"Do/does/did w zdaniu twierdzącym podkreśla prawdziwość.","ex":"I do like it!"},{"h":"Forma podstawowa","t":"Po operatorze czasownik bez końcówki -s/-ed.","ex":"She does know."},{"h":"Przeszłość","t":"Did + forma podstawowa.","ex":"He did call yesterday."}]},{"id":"g51","stage":"wojewódzki","title":"51. Wyrazy wieloznaczne","desc":"Etap wojewódzki, temat 51","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"Znaczenie z kontekstu","t":"To samo słowo może mieć kilka znaczeń.","ex":"bank = bank / brzeg rzeki"},{"h":"Część mowy","t":"Wyraz może być rzeczownikiem i czasownikiem.","ex":"book a room / read a book"},{"h":"Dobór odpowiedzi","t":"Patrz na całe zdanie, nie pojedyncze słowo.","ex":"a light bag = lekka torba"}]},{"id":"pod1","stage":"podcasty","title":"Great Britain and the UK","desc":"Cztery kraje i miejsca na mapie","size":4,"shuffle":false,"link":"https://konkurs-angielski-gramatyka.adamf2000.chatgpt.site/podcast-uk.html","linkLabel":"Posłuchaj nagrania"},{"id":"pod2","stage":"podcasty","title":"Londyn: zabytki","desc":"Westminster, pałac, Tower i mosty","size":4,"shuffle":false,"link":"https://konkurs-angielski-gramatyka.adamf2000.chatgpt.site/podcast-london.html","linkLabel":"Posłuchaj nagrania"},{"id":"pod3","stage":"podcasty","title":"USA: miejsca do poznania","desc":"Sześć miejsc rozpoznawanych po opisie","size":4,"shuffle":false,"link":"https://konkurs-angielski-gramatyka.adamf2000.chatgpt.site/podcast-usa-places.html","linkLabel":"Posłuchaj nagrania"},{"id":"pod4","stage":"podcasty","title":"USA: geografia w pigułce","desc":"Granice, góry, rzeki i klimat","size":4,"shuffle":false,"link":"https://konkurs-angielski-gramatyka.adamf2000.chatgpt.site/podcast-usa-geography.html","linkLabel":"Posłuchaj nagrania"},{"id":"vocab","title":"Słownictwo","desc":"Słowa, synonimy i kolokacje","stage":"dodatki"},{"id":"grammar","title":"Gramatyka","desc":"Czasy, tryby warunkowe, mowa zależna","stage":"dodatki"},{"id":"phrasal","title":"Frazowe i idiomy","desc":"Phrasal verbs i wyrażenia","stage":"dodatki"},{"id":"wordform","title":"Słowotwórstwo","desc":"Rodziny wyrazów, przedrostki, przyrostki","stage":"dodatki"},{"id":"reading","title":"Czytanie","desc":"Krótkie teksty i pytania","size":4,"shuffle":false,"stage":"dodatki"}],"passages":{"silent":{"title":"The Silent Library","text":"Every Saturday morning, Maya walks to the old library at the end of her street. It is a quiet place with tall windows and wooden shelves that smell of paper and polish. Last month the librarian, Mr Dunn, told her that the library might close because fewer people visit it. Maya decided to act. She made colourful posters and asked her classmates to join a reading club. Within three weeks, twenty-two children had signed up. Mr Dunn was so surprised that he forgot to be quiet and laughed out loud."},"octopus":{"title":"Clever Octopuses","text":"Octopuses are among the most intelligent animals in the sea. They have no bones, so they can squeeze through holes no bigger than a coin. An octopus has three hearts and blue blood. When in danger, it can change colour to hide or release a cloud of dark ink to confuse its enemy. Scientists have seen octopuses open jars and escape from tanks at night, which shows that they are very good at solving problems."},"pod1":{"title":"Transkrypcja: Great Britain and the UK","text":"Great Britain and the United Kingdom. They sound like two names for the same place, don't they? But there is an important difference. Picture a map of north-western Europe. Just off the coast, you can see a large island. That island is Great Britain. It contains three countries: England, Scotland and Wales. Now move your finger west, to the island of Ireland. Its north-eastern part is Northern Ireland. Add Northern Ireland to the three countries on Great Britain, and you get the United Kingdom. That's four countries altogether. The Republic of Ireland is a separate country. Let's take a short trip around the map. First stop: England. Its capital is London, and the River Thames runs through the city. In the north-west of England, the Lake District is a landscape of lakes, valleys and mountains. Farther south, in Wiltshire, stands Stonehenge: a famous prehistoric circle of enormous stones. Head west, and you reach Wales. Its capital is Cardiff. Welsh is a living language here, and you will often see signs in both Welsh and English. In the mountains of Eryri stands the highest peak in Wales: Snowdon, called Yr Wyddfa in Welsh. Travel north to Scotland. Its capital is Edinburgh. Beyond the city lie the Highlands, with their mountains, glens and lochs. Ben Nevis is here. At about one thousand three hundred and forty-five metres, it is the highest mountain in the whole United Kingdom. Finally, cross the Irish Sea to Northern Ireland. Its capital is Belfast. On the north coast, you can see the Giant's Causeway. Thousands of dark basalt columns meet the sea. They look almost like steps made by a giant, but they formed through volcanic activity. Before we finish, look at the water around the islands. The Atlantic Ocean is to the west. The North Sea is to the east of Great Britain. The English Channel lies between southern England and France. And the Irish Sea separates Great Britain from the island of Ireland. So, remember the simple rule. Great Britain means the large island and its three countries. The United Kingdom includes Northern Ireland as well."},"pod2":{"title":"Transkrypcja: Londyn","text":"Imagine you are standing beside the River Thames in London. You have one afternoon to recognise the city's most famous landmarks. Where should you begin? Start in Westminster, the political heart of the United Kingdom. The Palace of Westminster is where the two Houses of Parliament meet. Beside it stands the Elizabeth Tower. Many visitors call the whole tower Big Ben. Strictly speaking, Big Ben is the name of the great bell inside. If a question describes a clock tower next to Parliament, you know the place. Nearby is Westminster Abbey. Although it is a church, it has also been the setting for royal coronations for centuries. Remember the contrast: Parliament is where laws are debated; Westminster Abbey is connected with ceremonies, including coronations. Walk towards Buckingham Palace, the monarch's official London residence. The Changing of the Guard is a well-known ceremony outside the palace. Now return to the river. On the opposite bank, the London Eye is a large observation wheel. It offers views across the city. It is a modern attraction, unlike the historic abbey or the old fortress we will visit next. Travel east along the Thames to the Tower of London. The word tower may make you picture just one building. In fact, it is a historic castle and fortress. It has served as a royal palace and a prison, and today visitors can see the Crown Jewels there. Close by stands Tower Bridge, the famous bridge with two towers. Be careful: London Bridge is a different bridge. One final landmark is the British Museum, where collections tell stories of human history from around the world."},"pod3":{"title":"Transkrypcja: USA, miejsca","text":"The United States is a huge country, so let's cross it from east to west. At each stop, remember the name, the location and one reason it is famous. Our first stop is New York City. On an island in New York Harbor stands the Statue of Liberty. It is a monument representing freedom, and it became a powerful symbol for people arriving in America. In Manhattan, Central Park is a large green space among city streets and tall buildings. Do not confuse New York City with Washington, D.C., the national capital. In Washington, D.C., the White House is the official residence and workplace of the US president. The city also has the National Mall, with major monuments and museums. If a question asks for the country's capital, the answer is Washington, D.C., not New York. Now travel south-west to Arizona. The Grand Canyon is an enormous canyon carved by the Colorado River. Its colourful layers of rock make it one of America's best-known natural wonders. Remember: Grand Canyon, Arizona, Colorado River. The river's name does not mean that the canyon is in the state of Colorado. Head north towards Yellowstone National Park. Much of the park lies in Wyoming, and it extends into Montana and Idaho. It is famous for geothermal features, especially geysers such as Old Faithful, and for wildlife. A geyser sends hot water and steam into the air. Farther west, reach California. In San Francisco, the Golden Gate Bridge is a suspension bridge over the strait called the Golden Gate. It is recognised by its orange-red colour and its two tall towers. In Los Angeles, Hollywood is closely associated with the film industry. These two famous places are in the same state, but in different cities."},"pod4":{"title":"Transkrypcja: USA, geografia","text":"Picture a map of North America. The United States lies between Canada to the north and Mexico to the south. The Atlantic Ocean is on its eastern side, and the Pacific Ocean is to the west. The country has fifty states, but not all of them form one continuous block. Forty-eight states are connected in the main part of the country. Alaska is far to the north-west, next to Canada. Hawaii is a group of islands in the Pacific Ocean. Remember those two exceptions when you look at a map. Washington, D.C., is the national capital. It is a federal district, not one of the fifty states. Let's travel across the mainland. In the east, the Appalachian Mountains form an old mountain chain. Farther west, the Mississippi River flows south across the central part of the country towards the Gulf of Mexico. Together with its major tributary, the Missouri River, it forms one of North America's great river systems. A tributary is a river that flows into another river. The Great Plains are broad, mostly flat lands in the centre of the continent. Farther west stand the Rocky Mountains, often called the Rockies. Think of the simple order from east to west: Appalachians, Mississippi and the plains, Rockies, then the Pacific coast. The Colorado River is another important river. It carved the Grand Canyon in Arizona. The name Colorado appears in a river and in a state, but the Grand Canyon is in Arizona. What about the weather? The USA is so large that it has many climates. Alaska is generally much colder than the southern states. The south-west includes dry desert areas. Florida is warm and humid. Hawaii has a tropical climate. The north and the mountains can have cold, snowy winters."}},"ques d":"pod4b","unit":"pod4","type":"mc","passageId":"pod4","q":"Which ocean is on the west coast of the USA?","options":["The Pacific Ocean","The Atlantic Ocean","The Indian Ocean","The Arctic Ocean"],"answer":0,"explain":"The Pacific Ocean."},{"id":"pod4c","unit":"pod4","type":"mc","passageId":"pod4","q":"Which states are separate from the connected forty-eight?","options":["Alaska and Hawaii","Florida and Texas","Alaska and Maine","Hawaii and Nevada"],"answer":0,"explain":"Alaska i Hawaje."},{"id":"pod4d","unit":"pod4","type":"mc","passageId":"pod4","q":"Is Washington, D.C., one of the fifty states?","options":["No, it is a federal district.","Yes, it is the fiftieth state.","Yes, it is the first state."],"answer":0,"explain":"To dystrykt federalny, nie stan."},{"id":"pod4e","unit":"pod4","type":"mc","passageId":"pod4","q":"Which mountains lie in the west of the USA?","options":["The Rocky Mountains","The Appalachian Mountains","The Alps","The Andes"],"answer":0,"explain":"The Rockies na zachodzie, Appalachy na wschodzie."},{"id":"pod4f","unit":"pod4","type":"mc","passageId":"pod4","q":"In which state is the Grand Canyon?","options":["Arizona","Colorado","Wyoming","California"],"answer":0,"explain":"Arizona."},{"id":"pod4g","unit":"pod4","type":"match","q":"Dopasuj słowa z nagrania","pairs":[["contiguous","połączone terytorialnie"],["tributary","dopływ rzeki"],["plains","równiny"],["humid","wilgotny"]],"explain":"Słowniczek z odcinka 04."},{"id":"v1","unit":"vocab","type":"mc","q":"She was so ____ by the joke that she couldn't stop laughing.","options":["amused","annoyed","anxious","ashamed"],"answer":0,"explain":"Amused = rozbawiona. Annoyed to zirytowana, anxious – zaniepokojona, ashamed – zawstydzona."},{"id":"v2","unit":"vocab","type":"mc","q":"The opposite of 'generous' is ____.","options":["stingy","honest","curious","modest"],"answer":0,"explain":"Stingy = skąpy, czyli przeciwieństwo hojnego (generous)."},{"id":"v3","unit":"vocab","type":"mc","q":"I'm sorry, I esz. Earn money, ale win a prize."},{"id":"v13","unit":"vocab","type":"mc","q":"Can I ____ your pen? I forgot mine.","options":["lend","borrow","owe","spend"],"answer":1,"explain":"Borrow = pożyczyć od kogoś, lend = pożyczyć komuś."},{"id":"v14","unit":"vocab","type":"mc","q":"Which word is NOT a synonym of 'happy'?","options":["delighted","cheerful","miserable","glad"],"answer":2,"explain":"Miserable = nieszczęśliwy, to przeciwieństwo."},{"id":"v15","unit":"vocab","type":"mc","q":"The students must ____ attention to the teacher.","options":["pay","give","make","take"],"answer":0,"explain":"Kolokacja: pay attention (zwracać uwagę)."},{"id":"v16","unit":"vocab","type":"mc","q":"Someone who lives next door to you is your ____.","options":["neighbour","relative","colleague","stranger"],"answer":0,"explain":"Neighbour = sąsiad."},{"id":"v17","unit":"vocab","type":"mc","q":"The ____ of the mountains in the lake was beautiful.","options":["reflection","reaction","direction","protection"],"answer":0,"explain":"Reflection = odbicie."},{"id":"v18","unit":"vocab","type":"mc","q":"Which word means 'to stop something from happening'?","options":["prevent","provide","predict","produce"],"answer":0,"explain":"Prevent = zapobiegać."},{"id":"g1","unit":"grammar","type":"mc","q":"If I ____ you, I would apologise.","options":["were","was","am","be"],"answer":0,"explain":"W 2. okresie warunkowym po I/he/she zwykle używamy 'were': If I were you…"},{"id":"g2","unit":"grammar","type":"mc","q":"She ____ in London since 2019.","options":["lives","has lived","is living","lived"],"answer":1,"explain":"Since + punkt w czasie wymaga Present Perfect: has lived."},{"id":"g3","unit":"grammar","type":"mc","q":"By the time we arrived, the film ____.","options":["had already started","already started","has already started","was already starting"],"answer":0,"explain":"Past Perfect: czynność wcześniejsza niż inna czynność w przeszłości."},{"id":"g4","unit":"grammar","type":"mc","q":"The window ____ by the storm last night.","options":["was broken","broke","has broken","is broken"],"answer":0,"explain":"Strona bierna w Past Simple: was/were + III forma czasownika."},{"id":"g5","unit":"grammar","type":"mc","q":"'I am tired,' said Tom. → Tom said that he ____ tired.","options":["was","is","were","has been"],"answer":0,"explain":"W mowie zależnej cofamy czas: am → was."},{"id":"g6","unit":"grammar","type":"type","q":"I ____ him since Monday. (not / see)","hint":"Present Perfect, przeczenie","answers":["haven't seen","have not seen"],"explain":"Present Perfect w przeczeniu: haven't seen."},{"id":"g7","unit":"grammar","type":"type","q":"He is the ____ boy in our class. (tall)","answers":["tallest"],"explain":"Stopień najwyższy: the tallest."},{"id":"g8","unit":"grammar","type":"mc","q":"Neither of the boys ____ the answer.","options":["knows","know","knowing","have known"],"answer":0,"explain":"Neither of… w poprawnej angielszczyźnie łączy się z czasownikiem w 3. os. l. poj."},{"id":"g9","unit":"grammar","type":"mc","q":"I'm looking forward to ____ you.","options":["meeting","meet","met","to meet"],"answer":0,"explain":"Look forward to + forma -ing."},{"id":"g10","unit":"grammar","type":"mc","q":"There isn't ____ milk left in the fridge.","options":["any","some","no","a"],"answer":0,"explain":"W zdaniach przeczących używamy any."},{"id":"g11","unit":"grammar","type":"order","q":"Put the words in the correct order.","hint":"Ona uczy się angielskiego od trzech lat.","words":["She","has","been","learning","English","for","three","years"],"answer":"She has been learning English for three years","explain":"Present Perfect Continuous: has been + -ing, a for oznacza okres czasu."},{"id":"g12","unit":"grammar","type":"order","q":"Put the words in the correct order.","hint":"Jeśli jutro będzie padać, zostaniemy w domu.","words":["If","it","rains","tomorrow","we","will","stay","at","home","would"],"answer":"If it rains tomorrow we will stay at home","explain":"1. okres warunkowy: If + Present Simple, will + bezokolicznik. Słowo 'would' było zbędne."},{"id":"g13","unit":"grammar","type":"mc","q":"He asked me where ____.","options":["I lived","did I live","do I live","I had live"],"answer":0,"explain":"W pytaniach zależnych jest szyk oznajmujący: where I lived."},{"id":"g14","unit":"grammar","type":"mc","q":"You ____ wear a uniform at our school. It's a rule.","options":["must","might","needn't","can"],"answer":0,"explain":"Must = musieć (obowiązek wynikający z zasad)."},{"id":"g15","unit":"grammar","type":"mc","q":"The lights are on, so she ____ be at home.","options":["must","can't","shouldn't","needn't"],"answer":0,"explain":"Must wyraża tu pewny wniosek: na pewno jest w domu."},{"id":"g16","unit":"grammar","type":"type","q":"This pizza is ____ than that one. (good)","answers":["better"],"explain":"good – better – the best."},{"id":"g17","unit":"grammar","type":"mc","q":"I wish I ____ more free time.","options":["had","have","would have","has"],"answer":0,"explain":"I wish + Past Simple opisuje życzenie dotyczące teraźniejszości."},{"id":"g18","unit":"grammar","type":"mc","q":"How ____ people came to the party?","options":["many","much","a lot","few"],"answer":0,"explain":"How many pytamy o rzeczy policzalne (people)."},{"id":"p1","unit":"phrasal","type":"mc","q":"We had to ____ the match because of the rain.","options":["call off","call on","call up","call in"],"answer":0,"explain":"Call off = odwołać."},{"id":"p2","unit":"phrasal","type":"mc","q":"I can't ____ what he is saying. It's too noisy.","options":["make out","make up","make for","make off"],"answer":0,"explain":"Make out = dosłyszeć, zrozumieć, dostrzec."},{"id":"p3","unit":"phrasal","type":"mc","q":"Please ____ your shoes before you enter.","options":["take off","take out","take up","take in"],"answer":0,"explain":"Take off = zdjąć (ubranie, buty)."},{"id":"p4","unit":"phrasal","type":"mc","q":"She ____ her mother. They have the same smile.","options":["takes after","takes off","takes over","takes in"],"answer":0,"explain":"Take after = być podobnym do kogoś z rodziny."},{"id":"p5","unit":"phrasal","type":"mc","q":"Hurry up! We're ____ time.","options":["running out of","running away from","running into","running over"],"answer":0,"explain":"Run out of = kończyć się, zabraknąć."},{"id":"p6","unit":"phrasal","type":"mc","q":"'It's raining cats and dogs.' What does it mean?","options":["It is raining very heavily.","Animals are falling from the sky.","It is only drizzling.","It is windy."],"answer":0,"explain":"Idiom oznacza ulewę."},{"id":"p7","unit":"phrasal","type":"mc","q":"Before the match the coach said, 'Break a leg!' It means ____.","options":["good luck","be careful","run fast","you will get hurt"],"answer":0,"explain":"Break a leg = powodzenia."},{"id":"p8","unit":"phrasal","type":"mc","q":"'The test was a piece of cake.' It means the test was ____.","options":["very easy","sweet","dangerous","expensive"],"answer":0,"explain":"A piece of cake = bułka z masłem."},{"id":"p9","unit":"phrasal","type":"type","q":"I'm looking ____ my keys. Have you seen them?","answers":["for"],"explain":"Look for = szukać."},{"id":"p10","unit":"phrasal","type":"type","q":"Don't give ____! You can do it.","answers":["up"],"explain":"Give up = poddawać się."},{"id":"p11","unit":"phrasal","type":"match","q":"Dopasuj czasownik frazowy do znaczenia","pairs":[["give up","quit"],["put off","postpone"],["find out","discover"],["turn down","refuse"]],"explain":"Czasowniki frazowe często mają jednowyrazowe odpowiedniki."},{"id":"p12","unit":"phrasal","type":"mc","q":"'Once in a blue moon' means ____.","options":["very rarely","every day","only at night","never"],"answer":0,"explain":"Once in a blue moon = bardzo rzadko."},{"id":"w1","unit":"wordform","type":"type","q":"Her ____ to animals is well known. (kind)","answers":["kindness"],"explain":"kind → kindness (przymiotnik na rzeczownik, końcówka -ness)."},{"id":"w2","unit":"wordform","type":"type","q":"He is a very ____ person. He paints and writes songs. (create)","answers":["creative"],"explain":"create → creative (przymiotnik)."},{"id":"w3","unit":"wordform","type":"type","q":"It was ____ to open the door without the key. (possible)","answers":["impossible"],"explain":"possible → impossible (przedrostek im- przed p)."},{"id":"w4","unit":"wordform","type":"type","q":"The ____ gave us a lot of homework. (teach)","answers":["teacher"],"explain":"teach → teacher (osoba wykonująca czynność)."},{"id":"w5","unit":"wordform","type":"type","q":"She spoke ____ so as not to wake the baby. (quiet)","answers":["quietly"],"explain":"quiet → quietly (przysłówek)."},{"id":"w6","unit":"wordform","type":"type","q":"The ____ of the telephone changed the world. (invent)","answers":["invention"],"explain":"invent → invention (rzeczownik)."},{"id":"w7","unit":"wordform","type":"mc","q":"Which is the noun from 'decide'?","options":["decision","decided","decisive","decidedly"],"answer":0,"explain":"decide → decision. Decisive to przymiotnik (stanowczy)."},{"id":"w8","unit":"wordform","type":"mc","q":"What is the opposite of 'responsible'?","options":["irresponsible","unresponsible","disresponsible","nonresponsible"],"answer":0,"explain":"Przedrostek ir- tworzy przeciwieństwo: irresponsible."},{"id":"w9","unit":"wordform","type":"mc","q":"Which is the adjective from 'danger'?","options":["dangerous","dangerful","dangering","dangerly"],"answer":0,"explain":"danger → dangerous (końcówka -ous)."},{"id":"w10","unit":"wordform","type":"type","q":"Don't be so ____! You nearly dropped the vase. (care)","answers":["careless"],"explain":"care → careless (bez troski, nieostrożny)."},{"id":"w11","unit":"wordform","type":"type","q":"His ____ was too difficult to follow. (explain)","answers":["explanation"],"explain":"explain → explanation (zmienia się też pisownia)."},{"id":"w12","unit":"wordform","type":"match","q":"Dopasuj rzeczownik do czasownika","pairs":[["success","succeed"],["choice","choose"],["growth","grow"],["belief","believe"]],"explain":"Rzeczowniki i czasowniki z jednej rodziny wyrazów."},{"id":"r1","unit":"reading","type":"mc","passageId":"silent","q":"Why might the library close?","options":["It is too old.","Fewer people visit it.","It is too noisy.","The books are damaged."],"answer":1,"explain":"Mr Dunn powiedział, że biblioteka może zostać zamknięta, bo odwiedza ją coraz mniej osób."},{"id":"r2","unit":"reading","type":"mc","passageId":"silent","q":"What did Maya do to help?","options":["She wrote to the mayor.","She made posters and invited classmates.","She bought new books.","She cleaned the shelves."],"answer":1,"explain":"Maya zrobiła plakaty i zaprosiła kolegów do klubu czytelniczego."},{"id":"r3","unit":"reading","type":"mc","passageId":"silent","q":"How many children signed up for the reading club?","options":["twelve","twenty","twenty-two","thirty-two"],"answer":2,"explain":"W tekście: twenty-two children had signed up."},{"id":"r4","unit":"reading","type":"mc","passageId":"silent","q":"Why did Mr Dunn laugh out loud?","options":["He heard a joke.","He was surprised by how many children joined.","He wanted to scare Maya.","He was nervous."],"answer":1,"explain":"Był tak zaskoczony, że zapomniał o ciszy w bibliotece."},{"id":"r5","unit":"reading","type":"mc","passageId":"octopus","q":"Why can an octopus squeeze through tiny holes?","options":["It is very small.","It has no bones.","It has eight arms.","It is very fast."],"answer":1,"explain":"W tekście: they have no bones."},{"id":"r6","unit":"reading","type":"mc","passageId":"octopus","q":"How many hearts does an octopus have?","options":["one","two","three","eight"],"answer":2,"explain":"An octopus has three hearts and blue blood."},{"id":"r7","unit":"reading","type":"mc","passageId":"octopus","q":"What can an octopus do to confuse its enemy?","options":["Make a loud noise.","Release dark ink.","Dig a hole.","Swim to the surface."],"answer":1,"explain":"Wypuszcza chmurę ciemnego atramentu."},{"id":"r8","unit":"reading","type":"mc","passageId":"octopus","q":"What do the jar and tank examples show?","options":["Octopuses are dangerous.","Octopuses are good at solving problems.","Octopuses like living in tanks.","Octopuses are afraid of people."],"answer":1,"explain":"Autor podaje je jako dowód, że ośmiornice dobrze radzą sobie z problemami."}]}</script>
<script>
(function(){
'use strict';
var BANK=JSON.parse(document.getElementById('bank').textContent);
var KEY='olimp-english-v1';
var $=function(s){return document.querySelector(s);};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var fmt=function(s){return esc(s).replace(/_{3,}/g,'<span class="blank"></span>');};
var shuffle=function(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;};
var ico=function(n,s){s=s||22;return '<svg class="i" width="'+s+'" height="'+s+'" aria-hidden="true"><use href="#i-'+n+'"/></svg>';};

/* ---------- stan ---------- */
function def(){return {xp:0,streak:0,best:0,last:null,hearts:5,hts:Date.now(),goal:50,daily:{d:'',xp:0},
  done:{},mistakes:[],wrong:{},badges:{},us:{},stats:{answered:0,correct:0,lessons:0,perfect:0,fixed:0},
  custom:{units:[],questions:[],passages:{}},sound:true,stage:'szkolny'};}
function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);var d=def();for(var k in o)d[k]=o[k];if(!d.custom.passages)d.custom.passages={};return d;}}catch(e){}return def();}
var S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
var dstr=function(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
var today=function(){return dstr(new Date());};
var yesterday=function(){var d=new Date();d.setDate(d.getDate()-1);return dstr(d);};
function rollDaily(){if(S.daily.d!==today())S.daily={d:today(),xp:0};}
function streakNow(){if(!S.last)return 0;return (S.last===today()||S.last===yesterday())?S.streak:0;}
var pd=function(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);};

function resolve(ok,skipped){
  var q=cur(),id=q.id;L.status=ok?'ok':'bad';L.skipped=!!skipped;L.msgi=Math.floor(Math.random()*20);L.fixedNow=false;L.cheer=null;
  L.tries[id]=(L.tries[id]||0)+1;
  var us=S.us[q.unit]=S.us[q.unit]||{a:0,c:0};
  if(L.tries[id]===1){S.stats.answered++;us.a++;}
  if(ok){
    L.fixedNow=!!L.seen[id];
    if(!L.solvedSet[id]){L.solvedSet[id]=1;L.solved++;if(L.total>=4&&L.solved===Math.ceil(L.total/2))L.cheer='Połowa za Tobą!';}
    if(!L.seen[id]){L.first++;S.stats.correct++;us.c++;}
    L.combo++;S.stats.bestCombo=Math.max(N('bestCombo'),L.combo);
    if(L.mode==='review'){var k=S.mistakes.indexOf(id);if(k>=0){S.mistakes.splice(k,1);S.stats.fixed++;}}
    beep(SND.ok);
  }else{
    L.seen[id]=1;L.combo=0;
    S.wrong[id]=(S.wrong[id]||0)+1;
    if(L.mode==='lesson'){loseHeart();if(S.mistakes.indexOf(id)<0)S.mistakes.push(id);if(S.hearts<=0)L.dead=true;}
    if(L.tries[id]<2)L.queue.push(q);
    beep(SND.bad);buzz(80);
  }
  save();render();
}
function check(){
  var q=cur(),c=L.cur,ok=false;
  if(q.type==='mc')ok=c.opts[c.sel].i===q.answer;
  else if(q.type==='type'){var v=norm(c.val);ok=q.answers.some(function(a){return norm(a)===v;});}
  else if(q.type==='order')ok=norm(c.chosen.map(function(i){return c.words[i];}).join(' '))===norm(q.answer);
  resolve(ok,false);
}
function matchTap(side,p){
  var q=cur(),c=L.cur;if(L.status||c.done.indexOf(p)>=0)return;
  if(side==='l')c.sl=p;else c.sr=p;beep(SND.tap);
  if(c.sl!==null&&c.sr!==null){
    if(c.sl===c.sr){c.done.push(c.sl);c.sl=c.sr=null;if(c.done.length===q.pairs.length){resolve(c.errs===0,false);return;}beep(SND.ok);}
    else{c.errs++;c.flash=[c.sl,c.sr];c.sl=c.sr=null;beep(SND.bad);render();var ref=c;setTimeout(function(){if(L&&L.cur===ref){ref.flash=null;if(view==='lesson')render();}},520);return;}
  }
  render();
}

function addCustom(txt){
  var o;try{o=JSON.parse(txt);}catch(e){return 'To nie jest poprawny JSON. Sprawdź, czy skopiowano cały plik.';}
  var qs=Array.isArray(o)?o:(o.questions||[]),us=Array.isArray(o)?[]:(o.units||[]),ps=Array.isArray(o)?{}:(o.passages||{});
  if(!qs.length)return 'Nie znaleziono pytań (pole "questions").';
  var have={};allQ().forEach(function(q){have[q.id]=1;});var added=0,bad=0,stamp=Date.now().toString(36);
  us.forEach(function(u){if(u&&u.id&&u.title&&!units().some(function(x){return x.id===u.id;}))S.custom.units.push({id:String(u.id),title:String(u.title),desc:String(u.desc||''),size:u.size||6,shuffle:u.shuffle});});
  for(var k in ps)S.custom.passages[k]=ps[k];
  qs.forEach(function(q,n){
    if(!q||!q.unit||!q.type||!q.q){bad++;return;}
    q=JSON.parse(JSON.stringify(q));q.unit=String(q.unit);
    var okq=false;
    if(q.type==='mc')okq=Array.isArray(q.options)&&q.options.length>=2&&Number.isInteger(q.answer)&&q.answer>=0&&q.answer<q.options.length;
    else if(q.type==='type'){if(typeof q.answer==='string'&&!q.answers)q.answers=[q.answer];okq=Array.isArray(q.answers)&&q.answers.length>0;}
    else if(q.type==='order'){if(typeof q.answer==='string'&&!q.words)q.words=q.answer.split(' ');okq=typeof q.answer==='string'&&Array.isArray(q.words);}
    else if(q.type==='match')okq=Array.isArray(q.pairs)&&q.pairs.length>=2;
    if(!okq){bad++;return;}
    if(!units().some(function(x){return x.id===q.unit;}))S.custom.units.push({id:q.unit,title:q.unit,desc:'Własne pytania',size:6});
    if(!q.id||have[q.id])q.id='c'+stamp+'_'+n;
    have[q.id]=1;S.custom.questions.push(q);added++;
  });
  save();return 'Dodano pytań: '+added+(bad?'. Pominięto błędnych: '+bad:'')+'.';
}

document.addEventListener('click',function(e){
  if(cheat&&e.target.classList&&e.target.classList.contains('scrim')){cheat=null;render();return;}
  var t=e.target.closest('[data-act]');if(!t)return;var a=t.dataset.act,d=t.dataset,q;
  switch(a){
    case 'nav':view=d.v;pmsg='';resetArm=false;scrollCur=(d.v==='home');render();window.scrollTo(0,0);break;
    case 'stage':S.stage=d.s;save();scrollCur=true;render();break;
    case 'cheat':cheat=d.u||cur().unit;render();break;
    case 'cheatclose':cheat=null;render();break;
    case 'start':startLesson(d.u,+d.i);break;
    case 'locked':toast('Najpierw ukończ poprzednią lekcję');beep(SND.bad);break;
    case 'review':startReview();break;
    case 'done':view='home';R=null;scrollCur=true;render();window.scrollTo(0,0);break;
    case 'quit':L.quit=true;render();break;
    case 'qstay':L.quit=false;render();break;
    case 'qgo':L=null;view='home';scrollCur=true;render();break;
    case 'ptoggle':L.pOpen=!L.pOpen;render();break;
    case 'pick':if(L.status)return;L.cur.sel=+d.k;beep(SND.tap);render();break;
    case 'wpick':if(L.status)return;if(L.cur.chosen.indexOf(+d.w)<0)L.cur.chosen.push(+d.w);beep(SND.tap);render();break;
    case 'wun':if(L.status)return;L.cur.chosen=L.cur.chosen.filter(function(x){return x!==+d.w;});render();break;
    case 'ml':matchTap('l',+d.p);break;
    case 'mr':matchTap('r',+d.p);break;
    case 'check':if(canCheck())check();break;
    case 'skip':if(!L.status)resolve(false,true);break;
    case 'next':next();break;
    case 'goal':S.goal=+d.g;save();render();break;
    case 'sound':S.sound=d.s==='1';save();render();if(S.sound)beep(SND.ok);break;
    case 'gate':if(+($('#gate').value)===GA*GB){parentOk=true;pmsg='';}else pmsg='Spróbuj jeszcze raz.';render();break;
    case 'pclose':parentOk=false;pmsg='';GA=6+Math.floor(Math.random()*4);GB=6+Math.floor(Math.random()*4);render();break;
    case 'padd':pmsg=addCustom($('#cjson').value);render();break;
    case 'pclear':S.custom={units:[],questions:[],passages:{}};S.mistakes=S.mistakes.filter(qById);save();pmsg='Usunięto własne pytania.';render();break;
    case 'pcopy':var ta=$('#bk');ta.select();try{navigator.clipboard.writeText(ta.value).then(function(){toast('Skopiowano');},function(){try{document.execCommand('copy');toast('Skopiowano');}catch(_){}});}catch(_){try{document.execCommand('copy');toast('Skopiowano');}catch(__){}}break;
    case 'pimport':try{var o=JSON.parse(decodeURIComponent(escape(atob($('#bki').value.trim()))));if(typeof o.xp!=='number')throw 0;var nd=def();for(var k in o)nd[k]=o[k];if(!nd.custom.passages)nd.custom.passages={};S=nd;save();pmsg='Postępy przywrócone.';}catch(_){pmsg='Nieprawidłowy kod kopii.';}render();break;
    case 'preset':if(!resetArm){resetArm=true;}else{var c=S.custom;S=def();S.custom=c;save();resetArm=false;pmsg='Postępy wyzerowane.';}render();break;
  }
});
document.addEventListener('input',function(e){if(e.target.id==='ans'&&L&&L.cur){L.cur.val=e.target.value;var b=document.querySelector('[data-act="check"]');if(b)b.disabled=!canCheck();}});
document.addEventListener('keydown',function(e){
  if(view!=='lesson'||!L||cheat)return;
  if(e.key==='Enter'){if(L.status)next();else if(canCheck())check();return;}
  if(!L.status&&cur().type==='mc'&&/^[1-9]$/.test(e.key)&&+e.key<=L.cur.opts.length){L.cur.sel=+e.key-1;render();}
});
setInterval(function(){if(view==='nohearts'){tickHearts();var el=$('#hl');if(el)el.textContent=mmss(nextHeartMs());if(S.hearts>0){save();view='home';render();}}},1000);
rollDaily();tickHearts();render();
})();
</script>
</body></html>
