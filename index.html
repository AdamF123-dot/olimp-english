<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2B4FD8"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="icon" type="image/png" href="icons/icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Olimp English"><meta name="apple-mobile-web-app-status-bar-style" content="default"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style><title>Olimp English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: jedna wąska kolumna jak aplikacja mobilna; ścieżka lekcji w zygzaku, medale jako nagrody */
:root{
  --bg:#F3F5FA;--surface:#FFFFFF;--surface2:#E8ECF5;--ink:#15203B;--muted:#5C6884;--line:#D5DBEA;
  --brand:#2B4FD8;--brand-sh:#1B3697;--brand-soft:#E4EAFF;
  --gold:#F0A800;--gold-sh:#B27D00;--gold-soft:#FFF0C4;
  --ok:#1E9E5A;--ok-sh:#157545;--ok-soft:#DCF4E7;--ok-ink:#0F6B3B;
  --bad:#D6404A;--bad-sh:#A62B34;--bad-soft:#FDE2E4;--bad-ink:#A62B34;
  --flame:#F26A1B;--heart:#E5365B;
  --f-display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1426;--surface:#15203A;--surface2:#1F2C4D;--ink:#EEF2FF;--muted:#9AA8C7;--line:#2B3A5E;
  --brand:#4C68F2;--brand-sh:#2D45B8;--brand-soft:#1E2A57;
  --gold:#F5B82E;--gold-sh:#B88510;--gold-soft:#3A3012;
  --ok:#3CCB84;--ok-sh:#1F8F58;--ok-soft:#10382A;--ok-ink:#7BE0AB;
  --bad:#FF6B73;--bad-sh:#B8434A;--bad-soft:#40181D;--bad-ink:#FF9AA0;
  --flame:#FF8440;--heart:#FF5C80;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1426;--surface:#15203A;--surface2:#1F2C4D;--ink:#EEF2FF;--muted:#9AA8C7;--line:#2B3A5E;
  --brand:#4C68F2;--brand-sh:#2D45B8;--brand-soft:#1E2A57;
  --gold:#F5B82E;--gold-sh:#B88510;--gold-soft:#3A3012;
  --ok:#3CCB84;--ok-sh:#1F8F58;--ok-soft:#10382A;--ok-ink:#7BE0AB;
  --bad:#FF6B73;--bad-sh:#B8434A;--bad-soft:#40181D;--bad-ink:#FF9AA0;
  --flame:#FF8440;--heart:#FF5C80;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--f-display);margin:0;font-weight:600;text-wrap:balance}
p{margin:0}
.app{max-width:480px;margin:0 auto;padding-bottom:110px;min-width:0}
.i{flex:none;display:block}
.muted{color:var(--muted)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 0}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:600;font-size:19px}
.brand .mk{width:32px;height:32px;border-radius:10px;background:var(--gold);color:#3b2a00;display:grid;place-items:center}
.chips{display:flex;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-display);font-weight:600;font-size:16px;padding:5px 9px;border-radius:12px;background:var(--surface);border:2px solid var(--line)}
.chip.flame{color:var(--flame)}.chip.bolt{color:var(--gold-sh)}.chip.heart{color:var(--heart)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.bolt{color:var(--gold)}}
:root[data-theme="dark"] .chip.bolt{color:var(--gold)}

/* cards */
.card{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;min-width:0}
.card h3{font-size:19px;margin-bottom:8px}
.hero{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hero h2{font-size:22px}
.hero .sub{color:var(--muted);font-size:14px;margin-top:2px}
.lv{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;font-weight:700;color:var(--muted)}
.bar{flex:1;height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--gold);border-radius:99px}
.ring{flex:none}.ring .rb{fill:none;stroke:var(--surface2);stroke-width:7}
.ring .rf{fill:none;stroke:var(--gold);stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring .rt{font-family:var(--f-display);font-weight:600;font-size:13px;fill:var(--ink)}
.review{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--bad-soft);border:2px solid var(--bad);border-radius:18px;padding:12px 14px;margin-bottom:14px;color:var(--ink)}
.review b{font-family:var(--f-display);font-size:17px;display:block}
.review span{font-size:13px;color:var(--muted)}

/* path */
.unit{margin-top:22px}
.ubanner{background:var(--uc);color:#fff;border-radius:18px;padding:14px 16px;box-shadow:0 5px 0 var(--ucs)}
.ubanner h2{font-size:21px}.ubanner p{font-size:14px;opacity:.92}
.ubanner .pg{margin-top:6px;font-size:13px;font-weight:700;opacity:.95}
.step{display:flex;flex-direction:column;align-items:center;margin:16px 0 6px;transform:translateX(var(--x));position:relative}
.node{width:74px;height:74px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--uc);color:#fff;box-shadow:0 7px 0 var(--ucs);transition:transform .08s}
.node:active{transform:translateY(4px);box-shadow:0 3px 0 var(--ucs)}
.node.done{background:var(--gold);box-shadow:0 7px 0 var(--gold-sh);color:#3b2a00}
.node.locked{background:var(--surface2);box-shadow:0 7px 0 var(--line);color:var(--muted)}
.node.cur{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{outline:0 solid transparent}50%{outline:8px solid color-mix(in srgb,var(--uc) 28%,transparent)}}
.bubble{position:absolute;top:-30px;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:2px 10px;font-family:var(--f-display);font-weight:600;font-size:13px;color:var(--ink);letter-spacing:.06em}
.nl{font-size:12px;font-weight:700;color:var(--muted);margin-top:10px}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:2px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.nav>div{max-width:480px;margin:auto;display:flex;gap:6px}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border:2px solid transparent;border-radius:14px;background:none;color:var(--muted);font-size:12px;font-weight:700}
.nav button.on{color:var(--brand);background:var(--brand-soft);border-color:var(--brand)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .nav button.on{color:#B9C6FF}}
:root[data-theme="dark"] .nav button.on{color:#B9C6FF}

/* buttons */
.btn{border:0;border-radius:16px;padding:14px 20px;background:var(--brand);color:#fff;font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.04em;text-transform:uppercase;box-shadow:0 5px 0 var(--brand-sh);transition:transform .08s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 var(--brand-sh)}
.btn:disabled{background:var(--surface2);color:var(--muted);box-shadow:0 5px 0 var(--line);cursor:not-allowed}
.btn.okbtn{background:var(--ok);box-shadow:0 5px 0 var(--ok-sh)}
.btn.badbtn{background:var(--bad);box-shadow:0 5px 0 var(--bad-sh)}
.btn.gold{background:var(--gold);color:#3b2a00;box-shadow:0 5px 0 var(--gold-sh)}
.btn.ghost{background:transparent;color:var(--muted);box-shadow:none;border:2px solid var(--line);padding:12px 16px;font-size:15px}
.btn.small{padding:10px 14px;font-size:14px}
.icon-btn{background:none;border:0;padding:6px;color:var(--muted);border-radius:10px;display:grid;place-items:center}

/* lesson */
.lesson{max-width:480px;margin:0 auto;min-width:0}
.lbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 0}
.progress{flex:1;height:14px;border-radius:99px;background:var(--surface2);overflow:hidden}
.progress>i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .35s}
.lbody{padding:10px 0 240px}
.kicker{font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.qtext{font-size:25px;line-height:1.3;margin-bottom:6px;overflow-wrap:anywhere}
.blank{display:inline-block;min-width:64px;border-bottom:4px solid var(--brand);margin:0 4px;transform:translateY(3px)}
.hint{color:var(--muted);font-size:15px;margin-bottom:6px}
.lbx{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:16px 0 4px}
.lb{width:32px;height:42px;border:2px solid var(--line);border-bottom-width:5px;border-radius:10px;display:flex;align-items:center;justify-content:center;font:700 22px var(--f-display);background:var(--surface);color:var(--muted)}
.lb.rev{background:var(--gold-soft);border-color:var(--gold);color:var(--ink)}
.lb.sp{width:12px;border:0;background:none}
.lcount{text-align:center;color:var(--muted);font-size:14px;font-weight:600;margin:0 0 2px}
.say{margin-top:16px;padding:14px 16px;border:2px solid var(--brand);border-radius:16px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.say p{margin:0;color:var(--muted);font-size:15px}.say b{font-family:var(--f-display);font-size:17px}
.sayrow{display:flex;gap:10px;align-items:center}
.pulsem{display:inline-flex;color:var(--bad);animation:pulsem 1s ease-in-out infinite}
@keyframes pulsem{50%{transform:scale(1.25);opacity:.6}}
.sayans{font-family:var(--f-display);font-size:22px;color:var(--ink)!important;font-weight:600}
.row2{display:flex;gap:10px}.row2 .btn{flex:1;padding:12px 8px;font-size:15px}
.ro{pointer-events:none}
.modes{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.mode{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:18px 16px;border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;background:var(--surface);color:var(--ink);font-size:18px}
.mode small{display:block;margin-top:4px;font-size:14px;font-weight:500;color:var(--muted)}
.mode .mic{flex:none;width:52px;height:52px;border-radius:14px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center}
.mode.last{border-color:var(--brand)}
.micb{display:inline-flex;align-items:center;gap:6px}
.enter{animation:enter .28s ease-out}
@keyframes enter{from{opacity:.2;transform:translateX(18px)}to{opacity:1;transform:none}}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;background:var(--surface);color:var(--ink);font-weight:600;font-size:17px;overflow-wrap:anywhere}
.opt .key{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--muted)}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.sel .key{border-color:var(--brand);color:var(--brand)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.field{width:100%;padding:14px 16px;border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;background:var(--surface);color:var(--ink);font:600 20px var(--f-body);margin-top:18px}
.field:focus{outline:none;border-color:var(--brand)}
.field.okf{border-color:var(--ok);background:var(--ok-soft)}.field.badf{border-color:var(--bad);background:var(--bad-soft)}
.passage{background:var(--surface);border:2px solid var(--line);border-radius:16px;margin-bottom:16px;overflow:hidden}
.passage button{display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--gold-soft);border:0;padding:10px 14px;font-family:var(--f-display);font-weight:600;font-size:15px;text-align:left}
.passage .tx{padding:12px 14px;font-size:16px;line-height:1.55;max-height:38vh;overflow:auto}
.slots{min-height:64px;margin-top:18px;border-bottom:2px solid var(--line);padding-bottom:10px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;min-height:60px}
.wc{padding:10px 14px;border:2px solid var(--line);border-bottom-width:5px;border-radius:14px;background:var(--surface);color:var(--ink);font-weight:700;font-size:17px}
.wc.used{visibility:hidden}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.mcol{display:flex;flex-direction:column;gap:10px;min-width:0}
.mb{padding:12px 10px;border:2px solid var(--line);border-bottom-width:5px;border-radius:14px;background:var(--surface);color:var(--ink);font-weight:700;font-size:15px;min-height:56px;overflow-wrap:anywhere}
.mb.sel{border-color:var(--brand);background:var(--brand-soft)}
.mb.okm{border-color:var(--ok);background:var(--ok-soft);color:var(--ok-ink);opacity:.75}
.mb.fl{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:2px solid var(--line);
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.foot.ok{background:var(--ok-soft);border-color:var(--ok)}.foot.bad{background:var(--bad-soft);border-color:var(--bad)}
.fin{max-width:480px;margin:auto;display:flex;gap:12px;align-items:center;justify-content:space-between}
.fin .btn:not(.ghost){flex:1}
.foot.ok .fin,.foot.bad .fin{flex-direction:column;align-items:stretch;gap:12px}
.fb strong{font-family:var(--f-display);font-size:22px;display:block}
.foot.ok .fb{color:var(--ok-ink)}.foot.bad .fb{color:var(--bad-ink)}
.fb p{font-size:15px;color:var(--ink);margin-top:4px;overflow-wrap:anywhere}
.fb p.ex{color:var(--muted)}
.scrim{position:fixed;inset:0;background:rgba(5,10,25,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{width:100%;max-width:480px;background:var(--surface);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:12px}
.sheet h3{font-size:22px}

/* result */
.res{max-width:480px;margin:0 auto;padding:36px 0 40px;text-align:center}
.medal{width:132px;height:132px;border-radius:50%;margin:0 auto 18px;background:var(--gold);color:#3b2a00;display:grid;place-items:center;box-shadow:0 8px 0 var(--gold-sh);animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.4)}to{transform:scale(1)}}
.res h1{font-size:30px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}
.tile{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 6px}
.tile b{display:block;font-family:var(--f-display);font-size:26px;line-height:1.1}
.tile span{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.banner{border-radius:16px;padding:12px 14px;margin-bottom:12px;font-weight:700;text-align:left;display:flex;gap:12px;align-items:center}
.banner.lvup{background:var(--gold-soft);border:2px solid var(--gold)}
.banner.bdg{background:var(--brand-soft);border:2px solid var(--brand)}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30}
.confetti i{position:absolute;top:-16px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* badges / profile */
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.bd{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px 10px;text-align:center;min-width:0}
.bd .bi{width:60px;height:60px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;background:var(--bc);color:#fff}
.bd.lock{opacity:.55}.bd.lock .bi{background:var(--surface2);color:var(--muted)}
.bd b{display:block;font-family:var(--f-display);font-size:15px;line-height:1.2}
.bd span{font-size:12px;color:var(--muted)}
h2.sec{font-size:22px;margin:6px 0 12px}
.ladder{display:flex;flex-direction:column;gap:6px}
.lr{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;font-weight:700;color:var(--muted)}
.lr.on{background:var(--gold-soft);color:var(--ink);border:2px solid var(--gold)}
.lr.past{color:var(--ink)}
.lr small{margin-left:auto;font-weight:600}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.seg{display:flex;gap:6px}
.seg button{padding:8px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:700}
.seg button.on{border-color:var(--brand);background:var(--brand-soft)}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
textarea{width:100%;min-height:110px;padding:10px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
pre{background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:10px;overflow-x:auto;font-size:12px;margin:8px 0}
details summary{cursor:pointer;font-weight:700;margin:8px 0}
.msg{font-size:14px;font-weight:700;margin-top:8px;color:var(--brand)}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:700;max-width:90vw;text-align:center}
/* stages + cheat sheet */
.stages{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none}
.stages::-webkit-scrollbar{display:none}
.jump{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;overflow-x:auto;padding:8px 2px;margin:0 -2px 8px;background:var(--bg);scrollbar-width:none}
.jump::-webkit-scrollbar{display:none}
.jump span{flex:none;font-size:12px;font-weight:800;color:var(--muted)}
.jump button{flex:none;padding:6px 12px;border:2px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);font-weight:800;font-size:13px}
.unit{scroll-margin-top:56px}
.stages button{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:0;padding:8px 14px;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;background:var(--surface);color:var(--ink);font-family:var(--f-display);font-weight:600;font-size:15px;line-height:1.2}
.stages button small{font-family:var(--f-body);font-weight:700;font-size:11px;color:var(--muted)}
.stages button.on{border-color:var(--brand);background:var(--brand-soft)}
.uh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.uh>div:first-child{min-width:0}
.ubtn{display:flex;flex-direction:column;gap:6px;align-items:stretch;flex:none}
.ubtn button,.ubtn a{display:flex;align-items:center;gap:6px;justify-content:center;background:rgba(255,255,255,.2);color:#fff;border:2px solid rgba(255,255,255,.55);border-radius:12px;padding:5px 10px;font-weight:700;font-size:13px;text-decoration:none;white-space:nowrap}
.sheet.cheat{max-height:82vh;overflow:auto}
.ck{background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.ck b{font-family:var(--f-display);font-size:17px;display:block}
.ck p{font-size:15px;margin-top:2px}
.ck .ex{margin-top:6px;background:var(--gold-soft);border-radius:10px;padding:6px 10px;font-weight:700;font-size:15px}
.plink{display:inline-block;margin-top:8px;font-weight:700;color:var(--brand)}
.cheer{display:inline-block;background:var(--gold-soft);border:2px solid var(--gold);color:var(--ink);border-radius:12px;padding:4px 12px;font-family:var(--f-display);font-weight:600;font-size:15px;margin-bottom:10px;animation:enter .3s ease-out}
.banner.praise{background:var(--ok-soft);border:2px solid var(--ok)}
.banner.fire{background:var(--gold-soft);border:2px solid var(--flame)}
.praisep{font-size:18px;font-weight:700;margin-top:8px}
.nextb{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.nextb .bi{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--bc);color:#fff;flex:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script type="application/json" id="bank">{"units":[{"id":"g01","stage":"szkolny","title":"1. not mind · would prefer to · would rather","desc":"Etap szkolny, temat 1","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"don’t mind + -ing","t":"Nie mam nic przeciwko. Po mind użyj -ing.","ex":"I don’t mind waiting."},{"h":"would prefer to + verb","t":"Wolałbym: po prefer użyj to + bezokolicznik.","ex":"I’d prefer to stay."},{"h":"would rather + verb","t":"Wolałbym: po rather użyj formy bez to.","ex":"I’d rather stay."}]},{"id":"g02","stage":"szkolny","title":"2. so · such","desc":"Etap szkolny, temat 2","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"so + przymiotnik","t":"So stoi przed samym przymiotnikiem lub przysłówkiem.","ex":"It was so cold."},{"h":"such + (a/an) + rzeczownik","t":"Such odnosi się do grupy z rzeczownikiem.","ex":"It was such a cold day."},{"h":"Skutek","t":"Obie formy mogą łączyć się z that.","ex":"It was so late that we left."}]},{"id":"g03","stage":"szkolny","title":"3. ought to · need to · needn’t","desc":"Etap szkolny, temat 3","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"ought to","t":"Rada lub powinność: ought to + bezokolicznik.","ex":"You ought to rest."},{"h":"need to","t":"Konieczność: need to + bezokolicznik.","ex":"I need to study."},{"h":"needn’t","t":"Brak konieczności, nie zakaz. Po needn’t forma bez to.","ex":"You needn’t hurry."}]},{"id":"g04","stage":"szkolny","title":"4. used to","desc":"Etap szkolny, temat 4","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"used to + verb","t":"Dawny zwyczaj lub stan, który już nie jest aktualny.","ex":"I used to play chess."},{"h":"Przeczenie","t":"Po didn’t wraca podstawowa forma use.","ex":"I didn’t use to smoke."},{"h":"Pytanie","t":"Did + podmiot + use to + czasownik.","ex":"Did you use to live here?"}]},{"id":"g05","stage":"szkolny","title":"5. Strona bierna: Present Perfect i Future Simple","desc":"Etap szkolny, temat 5","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"Present Perfect passive","t":"have/has been + III forma czasownika.","ex":"The room has been cleaned."},{"h":"Future Simple passive","t":"will be + III forma czasownika.","ex":"The room will be cleaned."},{"h":"Ważny jest rezultat","t":"W stronie biernej podmiot otrzymuje działanie.","ex":"The letters have been sent."}]},{"id":"g06","stage":"szkolny","title":"6. Czasowniki złożone (phrasal verbs)","desc":"Etap szkolny, temat 6","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"Czasownik + cząstka","t":"Cząstka może zmienić sens czasownika.","ex":"give up = zrezygnować"},{"h":"Ucz się w kontekście","t":"Podobne czasowniki z inną cząstką mają różne znaczenia.","ex":"look after = opiekować się"},{"h":"Dopełnienie","t":"Niektóre są rozdzielne: turn it off.","ex":"Turn off the light. / Turn it off."}],"link":"https://konkurs-angielski-gramatyka.adamf2000.chatgpt.site/lekcje.html","linkLabel":"Lekcja 6 na stronie","linkIcon":"book"},{"id":"g07","stage":"szkolny","title":"7. Mowa zależna: say · tell · ask","desc":"Etap szkolny, temat 7","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"Zdania oznajmujące","t":"Say (that) + zdanie; tell + osoba + (that).","ex":"She told me she was tired."},{"h":"Polecenia","t":"Tell/ask + osoba + to + czasownik.","ex":"He told us to wait."},{"h":"Pytania i zakazy","t":"Ask if/wh-; zakaz: not to + czasownik.","ex":"She asked if I was ready."}]},{"id":"g08","stage":"szkolny","title":"8. Zdania przydawkowe definiujące i wtrącone","desc":"Etap szkolny, temat 8","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"Definiujące","t":"Dają niezbędną informację; bez przecinków.","ex":"The girl who won is here."},{"h":"Wtrącone","t":"Dodają informację; oddzielamy przecinkami.","ex":"Anna, who lives here, is kind."},{"h":"Zaimki","t":"Who dla osób, which dla rzeczy; that tylko w definiujących.","ex":"The book which I bought is new."}]},{"id":"g09","stage":"szkolny","title":"9. Rzeczowniki złożone i słowotwórstwo","desc":"Etap szkolny, temat 9","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"Rzeczownik złożony","t":"Dwa wyrazy mogą tworzyć jedną nazwę.","ex":"toothbrush = szczoteczka do zębów"},{"h":"Od czasownika","t":"Często dodajemy -er/-or lub -ment.","ex":"teach → teacher; develop → development"},{"h":"Od przymiotnika","t":"Często dodajemy -ness lub -ity.","ex":"happy → happiness; active → activity"}]},{"id":"g10","stage":"szkolny","title":"10. Zaimki nieokreślone","desc":"Etap szkolny, temat 10","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"Some- i any-","t":"Some zwykle w twierdzeniach, any zwykle w pytaniach i przeczeniach.","ex":"Someone is here. / Is anyone here?"},{"h":"No- i every-","t":"Nobody = nikt; everybody = wszyscy.","ex":"Nobody knows."},{"h":"Liczba pojedyncza","t":"Someone, nobody, everything łączą się z czasownikiem w liczbie pojedynczej.","ex":"Everybody is ready."}]},{"id":"g11","stage":"szkolny","title":"11. Szyk przymiotników","desc":"Etap szkolny, temat 11","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"Opinia przed faktem","t":"Najpierw subiektywna ocena, potem cechy opisowe.","ex":"a beautiful old house"},{"h":"Typowa kolejność","t":"Opinia → wielkość → wiek → kolor → pochodzenie → materiał.","ex":"a small old red Italian car"},{"h":"Bez przecinka","t":"Przymiotniki różnych kategorii zwykle stoją obok siebie.","ex":"a lovely little dog"}]},{"id":"g12","stage":"szkolny","title":"12. Przymiotniki o znaczeniu przeciwstawnym","desc":"Etap szkolny, temat 12","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"Przedrostki","t":"Un-, in-, im-, il-, ir-, dis- mogą odwracać znaczenie.","ex":"happy → unhappy"},{"h":"Dobór przedrostka","t":"Im- przed p/b/m; il- przed l; ir- przed r.","ex":"possible → impossible"},{"h":"Uważaj na pisownię","t":"Nie każdy przymiotnik przyjmuje un-.","ex":"regular → irregular"}]},{"id":"g13","stage":"szkolny","title":"13. yet · for · since · just","desc":"Etap szkolny, temat 13","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"yet","t":"Jeszcze / już; zwykle w pytaniu lub przeczeniu, na końcu zdania.","ex":"Have you finished yet?"},{"h":"for i since","t":"For + okres; since + moment rozpoczęcia.","ex":"for two years; since 2022"},{"h":"just","t":"Właśnie; często przed III formą w Present Perfect.","ex":"I have just arrived."}]},{"id":"g14","stage":"szkolny","title":"14. Stopniowanie przysłówków","desc":"Etap szkolny, temat 14","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"Regularnie","t":"Krótkie: -er/-est; wiele zakończonych na -ly: more/most.","ex":"fast → faster → fastest"},{"h":"Nieregularnie","t":"Well → better → best; badly → worse → worst.","ex":"She sings better than I do."},{"h":"Porównanie","t":"W stopniu wyższym zwykle używamy than.","ex":"He runs more quickly than me."}]},{"id":"g15","stage":"szkolny","title":"15. Spójniki i wyrażenia kontrastu","desc":"Etap szkolny, temat 15","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"as soon as · unless","t":"As soon as = gdy tylko; unless = jeśli nie.","ex":"Call me as soon as you arrive."},{"h":"although · however","t":"Although łączy części zdania; however zwykle rozpoczyna nowe zdanie.","ex":"Although it rained, we went out."},{"h":"despite · in spite of","t":"Po nich rzeczownik lub -ing, nie zwykłe zdanie.","ex":"Despite the rain, we went out."}]},{"id":"g16","stage":"szkolny","title":"16. Pytania z przyimkiem na końcu","desc":"Etap szkolny, temat 16","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"Naturalny szyk","t":"W zwykłym pytaniu przyimek może stać na końcu.","ex":"Who are you talking to?"},{"h":"Pytanie o rzecz","t":"Zachowaj przyimek wymagany przez czasownik.","ex":"What are you looking for?"},{"h":"Pytanie o miejsce","t":"Przyimek też może kończyć pytanie.","ex":"Which room did you go into?"}]},{"id":"g17","stage":"szkolny","title":"17. Przyimki kierunku i ruchu","desc":"Etap szkolny, temat 17","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"towards","t":"W stronę, bez koniecznego dotarcia do celu.","ex":"She walked towards the door."},{"h":"into · out of","t":"Ruch do środka i na zewnątrz.","ex":"He went into the room."},{"h":"across · through","t":"Across przez powierzchnię; through przez wnętrze.","ex":"across the road; through the tunnel"}]},{"id":"g18","stage":"szkolny","title":"18. Pytania pośrednie","desc":"Etap szkolny, temat 18","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"Szyk zdania","t":"Po zwrocie wprowadzającym zachowaj szyk oznajmujący.","ex":"Do you know where she lives?"},{"h":"Bez do/does/did","t":"Nie dodawaj operatora w części zależnej.","ex":"Can you tell me what he wants?"},{"h":"Pytania tak/nie","t":"Użyj if lub whether.","ex":"Do you know if he is here?"}]},{"id":"g19","stage":"szkolny","title":"19. II okres warunkowy","desc":"Etap szkolny, temat 19","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"Warunek","t":"If + Past Simple opisuje sytuację hipotetyczną.","ex":"If I had time, ..."},{"h":"Skutek","t":"Would + czasownik bez to.","ex":"... I would travel."},{"h":"Were","t":"W formalniejszym języku: If I were you.","ex":"If I were you, I’d ask."}]},{"id":"g20","stage":"szkolny","title":"20. Present Perfect Continuous · Future Continuous","desc":"Etap szkolny, temat 20","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"Present Perfect Continuous","t":"have/has been + -ing: czynność trwa od pewnego czasu.","ex":"I have been studying for two hours."},{"h":"Future Continuous","t":"will be + -ing: czynność będzie trwała w określonym momencie.","ex":"At eight, I will be studying."},{"h":"Wskazówki","t":"For/since zwykle naprowadza na pierwszy czas; at this time tomorrow na drugi.","ex":"She has been working since noon."}]},{"id":"g21","stage":"szkolny","title":"21. Question tags","desc":"Etap szkolny, temat 21","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"Przeciwna polaryzacja","t":"Po zdaniu twierdzącym zwykle tag przeczący.","ex":"She is here, isn’t she?"},{"h":"Odwrotnie","t":"Po zdaniu przeczącym tag twierdzący.","ex":"He isn’t ready, is he?"},{"h":"To samo orzeczenie","t":"Powtórz operator i odpowiedni zaimek.","ex":"They can swim, can’t they?"}]},{"id":"g22","stage":"szkolny","title":"22. Zaimki zwrotne i wzajemne","desc":"Etap szkolny, temat 22","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"Zwrotne","t":"Działanie wraca do wykonawcy: myself, yourself, himself itd.","ex":"He hurt himself."},{"h":"Wzajemne","t":"Each other / one another: ludzie działają wzajemnie.","ex":"They helped each other."},{"h":"Podkreślenie","t":"Zaimkiem zwrotnym można podkreślić samodzielność.","ex":"I made it myself."}]},{"id":"g23","stage":"szkolny","title":"23. be able to","desc":"Etap szkolny, temat 23","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"Umiejętność","t":"Be able to + forma podstawowa czasownika.","ex":"I am able to swim."},{"h":"Różne czasy","t":"Można używać tam, gdzie can nie ma potrzebnej formy.","ex":"I will be able to come."},{"h":"Dokonane osiągnięcie","t":"Was/were able to może wskazywać, że udało się coś zrobić.","ex":"She was able to escape."}]},{"id":"g24","stage":"szkolny","title":"24. Zdania współrzędnie złożone","desc":"Etap szkolny, temat 24","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"and · but · or","t":"Łączą równorzędne myśli: dodanie, kontrast, wybór.","ex":"I called, but she was out."},{"h":"so","t":"Pokazuje wynik.","ex":"It rained, so we stayed home."},{"h":"nor · yet","t":"Nor dodaje przeczenie; yet sygnalizuje kontrast.","ex":"He was tired, yet he continued."}]},{"id":"g25","stage":"rejonowy","title":"25. Past Perfect Continuous","desc":"Etap rejonowy, temat 25","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"Budowa","t":"had been + czasownik z -ing.","ex":"She had been waiting."},{"h":"Wcześniejsza czynność","t":"Czynność trwała przed innym wydarzeniem w przeszłości.","ex":"I had been studying before you arrived."},{"h":"Skutek","t":"Często tłumaczy widoczny w przeszłości rezultat.","ex":"He was tired because he had been running."}]},{"id":"g26","stage":"rejonowy","title":"26. III okres warunkowy","desc":"Etap rejonowy, temat 26","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"Warunek","t":"If + Past Perfect: sytuacja nie wydarzyła się w przeszłości.","ex":"If I had studied, ..."},{"h":"Skutek","t":"Would have + III forma.","ex":"... I would have passed."},{"h":"Znaczenie","t":"Rozważamy inny możliwy wynik przeszłości.","ex":"If she had left earlier, she would have caught it."}]},{"id":"g27","stage":"rejonowy","title":"27. Strona bierna we wszystkich czasach","desc":"Etap rejonowy, temat 27","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"Schemat","t":"Odpowiednia forma be + III forma czasownika.","ex":"The book is read."},{"h":"Czasy ciągłe","t":"is/was being + III forma.","ex":"The road is being repaired."},{"h":"Czasy perfect","t":"has/had been + III forma.","ex":"The letter had been sent."}]},{"id":"g28","stage":"rejonowy","title":"28. used to · would: dawne zwyczaje","desc":"Etap rejonowy, temat 28","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"used to","t":"Dawne nawyki oraz stany.","ex":"I used to live here."},{"h":"would","t":"Powtarzające się dawne czynności, zwykle w opowieści.","ex":"Every summer, we would swim."},{"h":"Ważna różnica","t":"Would w tym znaczeniu nie opisuje dawnych stanów.","ex":"I used to be shy."}]},{"id":"g29","stage":"rejonowy","title":"29. had better · it’s high time","desc":"Etap rejonowy, temat 29","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"had better","t":"Mocna rada: had better + forma bez to.","ex":"You’d better leave now."},{"h":"Przeczenie","t":"Had better not + czasownik.","ex":"You’d better not wait."},{"h":"it’s high time","t":"Czas najwyższy; po nim często Past Simple.","ex":"It’s high time we left."}]},{"id":"g30","stage":"rejonowy","title":"30. have/get something done","desc":"Etap rejonowy, temat 30","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"Usługa lub zlecenie","t":"Ktoś wykonuje czynność dla nas.","ex":"I had my hair cut."},{"h":"Schemat","t":"have/get + rzecz + III forma czasownika.","ex":"She got her phone repaired."},{"h":"Czas","t":"Odmieniamy have/get, a imiesłów pozostaje.","ex":"We will have the roof fixed."}]},{"id":"g31","stage":"rejonowy","title":"31. Mowa zależna z różnymi czasownikami","desc":"Etap rejonowy, temat 31","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"admit · deny","t":"Admit/deny + -ing przy przyznaniu lub zaprzeczeniu.","ex":"She admitted taking it."},{"h":"promise · offer","t":"Promise/offer + to + czasownik.","ex":"He promised to help."},{"h":"warn · advise","t":"Warn/advise + osoba + (not) to + czasownik.","ex":"She warned me not to go."}]},{"id":"g32","stage":"rejonowy","title":"32. Czasowniki modalne o przeszłości","desc":"Etap rejonowy, temat 32","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"must have","t":"Mocny wniosek o przeszłości.","ex":"He must have forgotten."},{"h":"might have","t":"Możliwość, brak pewności.","ex":"She might have missed the train."},{"h":"should have","t":"Niewykonana rada lub żal.","ex":"You should have called."}]},{"id":"g33","stage":"rejonowy","title":"33. be/get used to","desc":"Etap rejonowy, temat 33","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"be used to","t":"Być przyzwyczajonym do czegoś.","ex":"I am used to the noise."},{"h":"get used to","t":"Przyzwyczajać się, proces zmiany.","ex":"She is getting used to it."},{"h":"Po to: -ing","t":"To jest przyimkiem, więc po czasowniku używamy -ing.","ex":"I’m used to waking early."}]},{"id":"g34","stage":"rejonowy","title":"34. Imiesłowy czynne i bierne","desc":"Etap rejonowy, temat 34","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"Czynny współczesny","t":"-ing: czynność wykonywana przez podmiot.","ex":"Walking home, I saw Anna."},{"h":"Bierny","t":"III forma: podmiot odbiera działanie.","ex":"Built in 1900, the house is old."},{"h":"Uprzedni","t":"Having + III forma: czynność wcześniejsza.","ex":"Having finished, she left."}]},{"id":"g35","stage":"rejonowy","title":"35. Rzeczowniki tylko w liczbie pojedynczej","desc":"Etap rejonowy, temat 35","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"Niepoliczalne","t":"Information, advice, furniture zwykle bez -s.","ex":"The information is useful."},{"h":"Zgoda","t":"Czasownik w liczbie pojedynczej.","ex":"The news is good."},{"h":"Ilość","t":"A piece of advice/information zamiast an advice.","ex":"She gave me a piece of advice."}]},{"id":"g36","stage":"rejonowy","title":"36. Ułamki i liczby dziesiętne","desc":"Etap rejonowy, temat 36","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"Ułamki","t":"Licznik liczebnikiem głównym, mianownik często porządkowym.","ex":"one third; two thirds"},{"h":"Połówki i ćwiartki","t":"A half; a quarter; three quarters.","ex":"three quarters of a litre"},{"h":"Dziesiętne","t":"Kropka to point; cyfry po niej czytamy osobno.","ex":"3.14 = three point one four"}]},{"id":"g37","stage":"rejonowy","title":"37. Wykrzyknienia i zdania podrzędne","desc":"Etap rejonowy, temat 37","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"Wykrzyknienia","t":"What + (a/an) + rzeczownik; how + przymiotnik/przysłówek.","ex":"What a day! How beautiful!"},{"h":"Zdanie podrzędne","t":"Część zdania może pełnić funkcję podmiotu lub dopełnienia.","ex":"What she said surprised me."},{"h":"Okolicznik","t":"Because, although, when łączą zdanie z okolicznością.","ex":"I stayed because it rained."}]},{"id":"g38","stage":"rejonowy","title":"38. Bezokolicznik i gerundium","desc":"Etap rejonowy, temat 38","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"to + infinitive","t":"Po want, decide, hope zwykle to + czasownik.","ex":"I decided to go."},{"h":"-ing","t":"Po enjoy, avoid, mind: -ing.","ex":"She enjoys reading."},{"h":"Po przyimku","t":"Po przyimku użyj -ing.","ex":"He is good at swimming."}]},{"id":"g39","stage":"rejonowy","title":"39. Cleft sentences","desc":"Etap rejonowy, temat 39","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"It was ... that/who","t":"Wyróżnia część zdania.","ex":"It was Tom who called."},{"h":"What ... was","t":"Akcentuje informację po was.","ex":"What I need is a break."},{"h":"To samo znaczenie","t":"Zmienia nacisk, nie podstawowy fakt.","ex":"Anna found the key → It was Anna who found it."}]},{"id":"g40","stage":"rejonowy","title":"40. so am I · neither am I","desc":"Etap rejonowy, temat 40","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"So + operator + podmiot","t":"Zgoda ze zdaniem twierdzącym.","ex":"I am tired. So am I."},{"h":"Neither + operator + podmiot","t":"Zgoda ze zdaniem przeczącym.","ex":"I am not tired. Neither am I."},{"h":"Dopasuj operator","t":"Can → can; have → have; zwykły czasownik → do/does/did.","ex":"She likes it. So do I."}]},{"id":"g41","stage":"rejonowy","title":"41. Słowotwórstwo wieloetapowe","desc":"Etap rejonowy, temat 41","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"Przedrostek i przyrostek","t":"Można użyć więcej niż jednej cząstki.","ex":"happy → unhappy → unhappiness"},{"h":"Część mowy","t":"Sprawdź, czy zdanie wymaga rzeczownika, przymiotnika czy przysłówka.","ex":"care → careful → carefully"},{"h":"Pisownia","t":"Zwróć uwagę na zmiany litery, np. y → i.","ex":"happy → happiness"}]},{"id":"g42","stage":"wojewódzki","title":"42. Wyrażenia idiomatyczne","desc":"Etap wojewódzki, temat 42","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"Znaczenie całości","t":"Idiomu nie tłumaczymy dosłownie.","ex":"break the ice = przełamać pierwsze lody"},{"h":"Kontekst","t":"Sprawdź, czy wyrażenie pasuje do sytuacji.","ex":"a piece of cake = coś łatwego"},{"h":"Forma","t":"Zapamiętuj całe połączenie wyrazów.","ex":"once in a blue moon = bardzo rzadko"}]},{"id":"g43","stage":"wojewódzki","title":"43. Future Perfect · Future Perfect Continuous","desc":"Etap wojewódzki, temat 43","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"Future Perfect","t":"will have + III forma: coś będzie ukończone do wskazanego czasu.","ex":"By six, I will have finished."},{"h":"Future Perfect Continuous","t":"will have been + -ing: czynność będzie trwała określony czas.","ex":"By June, I will have been studying for a year."},{"h":"By + punkt czasu","t":"Częsty sygnał obu czasów.","ex":"by Friday; by the time you arrive"}]},{"id":"g44","stage":"wojewódzki","title":"44. Zdania warunkowe mieszane","desc":"Etap wojewódzki, temat 44","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"Przeszłość → teraźniejszość","t":"If + Past Perfect, would + czasownik: dawna przyczyna, dzisiejszy skutek.","ex":"If I had slept, I wouldn’t be tired now."},{"h":"Teraźniejszość → przeszłość","t":"If + Past Simple, would have + III forma.","ex":"If I were careful, I wouldn’t have lost it."},{"h":"Sygnały czasu","t":"Now i yesterday pomagają rozpoznać kierunek.","ex":"If she had left, she would be here now."}]},{"id":"g45","stage":"wojewódzki","title":"45. I wish · if only · suppose · I’d rather","desc":"Etap wojewódzki, temat 45","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"wish/if only + Past Simple","t":"Żal dotyczący teraźniejszości.","ex":"I wish I knew."},{"h":"wish/if only + Past Perfect","t":"Żal dotyczący przeszłości.","ex":"If only I had known."},{"h":"Wola co do innej osoby","t":"I’d rather + osoba + Past Simple.","ex":"I’d rather you stayed."}]},{"id":"g46","stage":"wojewódzki","title":"46. as if · as though","desc":"Etap wojewódzki, temat 46","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"Wygląd lub wrażenie","t":"As if/as though = jak gdyby.","ex":"He looks as if he is tired."},{"h":"Nierealność teraz","t":"Past Simple może pokazać, że wiemy, iż coś nie jest prawdą.","ex":"He talks as if he knew everything."},{"h":"Nierealność w przeszłości","t":"Past Perfect wskazuje wcześniejszą pozorną sytuację.","ex":"She acted as if she had seen a ghost."}]},{"id":"g47","stage":"wojewódzki","title":"47. Inwersja","desc":"Etap wojewódzki, temat 47","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"Negatywny wyraz na początku","t":"Po never, rarely, hardly następuje operator przed podmiotem.","ex":"Never have I seen this."},{"h":"Not only","t":"Not only + operator + podmiot + czasownik.","ex":"Not only did she sing, she danced."},{"h":"Warunkowa","t":"Bez if można użyć Had/Were/Should przed podmiotem.","ex":"Had I known, I would have helped."}]},{"id":"g48","stage":"wojewódzki","title":"48. either ... or · neither ... nor","desc":"Etap wojewódzki, temat 48","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"either ... or","t":"Jedna z dwóch możliwości.","ex":"Either tea or coffee is fine."},{"h":"neither ... nor","t":"Żadna z dwóch możliwości.","ex":"Neither Tom nor Anna came."},{"h":"Zgoda z bliższym podmiotem","t":"Czasownik często zgadza się z członem najbliższym.","ex":"Neither he nor his friends are here."}]},{"id":"g49","stage":"wojewódzki","title":"49. have somebody do · get somebody to do","desc":"Etap wojewódzki, temat 49","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"have + osoba + verb","t":"Sprawić, zlecić komuś czynność; bez to.","ex":"I had Tom fix the bike."},{"h":"get + osoba + to + verb","t":"Namówić lub doprowadzić do wykonania czynności.","ex":"I got Tom to fix the bike."},{"h":"Nie myl z usługą","t":"Have my bike fixed oznacza, że ktoś naprawił rower.","ex":"I had my bike fixed."}]},{"id":"g50","stage":"wojewódzki","title":"50. Emfatyczne do · does · did","desc":"Etap wojewódzki, temat 50","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"Wzmocnienie","t":"Do/does/did w zdaniu twierdzącym podkreśla prawdziwość.","ex":"I do like it!"},{"h":"Forma podstawowa","t":"Po operatorze czasownik bez końcówki -s/-ed.","ex":"She does know."},{"h":"Przeszłość","t":"Did + forma podstawowa.","ex":"He did call yesterday."}]},{"id":"g51","stage":"wojewódzki","title":"51. Wyrazy wieloznaczne","desc":"Etap wojewódzki, temat 51","size":5,"labels":["Ćwiczenie","Test"],"cards":[{"h":"Znaczenie z kontekstu","t":"To samo słowo może mieć kilka znaczeń.","ex":"bank = bank / brzeg rzeki"},{"h":"Część mowy","t":"Wyraz może być rzeczownikiem i czasownikiem.","ex":"book a room / read a book"},{"h":"Dobór odpowiedzi","t":"Patrz na całe zdanie, nie pojedyncze słowo.","ex":"a light bag = lekka torba"}]},{"id":"pod1","stage":"podcasty","title":"Great Britain and the UK","desc":"Cztery kraje i miejsca na mapie","size":4,"shuffle":false,"link":"https://konkurs-angielski-gramatyka.adamf2000.chatgpt.site/podcast-uk.html","linkLabel":"Posłuchaj nagrania"},{"id":"pod2","stage":"podcasty","title":"Londyn: zabytki","desc":"Westminster, pałac, Tower i mosty","size":4,"shuffle":false,"link":"https://konkurs-angielski-gramatyka.adamf2000.chatgpt.site/podcast-london.html","linkLabel":"Posłuchaj nagrania"},{"id":"pod3","stage":"podcasty","title":"USA: miejsca do poznania","desc":"Sześć miejsc rozpoznawanych po opisie","size":4,"shuffle":false,"link":"https://konkurs-angielski-gramatyka.adamf2000.chatgpt.site/podcast-usa-places.html","linkLabel":"Posłuchaj nagrania"},{"id":"pod4","stage":"podcasty","title":"USA: geografia w pigułce","desc":"Granice, góry, rzeki i klimat","size":4,"shuffle":false,"link":"https://konkurs-angielski-gramatyka.adamf2000.chatgpt.site/podcast-usa-geography.html","linkLabel":"Posłuchaj nagrania"},{"id":"vocab","title":"Słownictwo","desc":"Słowa, synonimy i kolokacje","stage":"dodatki"},{"id":"grammar","title":"Gramatyka","desc":"Czasy, tryby warunkowe, mowa zależna","stage":"dodatki"},{"id":"phrasal","title":"Frazowe i idiomy","desc":"Phrasal verbs i wyrażenia","stage":"dodatki"},{"id":"wordform","title":"Słowotwórstwo","desc":"Rodziny wyrazów, przedrostki, przyrostki","stage":"dodatki"},{"id":"reading","title":"Czytanie","desc":"Krótkie teksty i pytania","size":4,"shuffle":false,"stage":"dodatki"},{"id":"t01","stage":"testy","title":"Test 1","desc":"12 najważniejszych pozycji z arkusza. W każdej części pytania A–D, a na końcu test literowy","size":8,"labels":["Część 1","Część 2","Część 3"],"cards":[{"h":"it’s high time + Past Simple","t":"najwyższy czas, żebyś…","ex":"Isn't it high time you started revising for your examinations?"},{"h":"the most … I have ever been to","t":"najpiękniejsze miejsce, w jakim kiedykolwiek byłem","ex":"This is the most beautiful place I have ever been to."},{"h":"look forward to + -ing","t":"nie móc się doczekać","ex":"The children are already looking forward to summer holidays."},{"h":"while + Past Continuous","t":"podczas gdy","ex":"It was raining hard while we were driving back home."},{"h":"danger → dangerous","t":"niebezpieczny","ex":"We don’t let our children play with the neighbour’s dog. We think it’s dangerous."},{"h":"pretty → prettily","t":"ładnie (przysłówek)","ex":"‘Look at Cindy. Isn’t she prettily dressed?’ ‘Indeed. She is.’"},{"h":"the majority of","t":"większość","ex":"The majority of our students can speak foreign languages."},{"h":"make a decision","t":"podjąć decyzję","ex":"Have you made a decision yet? Are you going with us or staying at home?"},{"h":"fail an exam","t":"oblać egzamin","ex":"‘Why is Steven so worried?’ ‘I’m afraid he has failed the maths exam.’"},{"h":"have a quarrel","t":"pokłócić się","ex":"Last week, Greg and I had a terrible quarrel. I called him a fool and he said that I was a witch."},{"h":"manage to + bezokolicznik","t":"udało się coś zrobić","ex":"Fortunately, all the passengers of the sinking ferry managed to escape before it went under water."},{"h":"go well with","t":"pasować do","ex":"The red tie doesn’t go well with the green shirt."}],"free":true,"shuffle":false},{"id":"t03","stage":"testy","title":"Test 3","desc":"12 najważniejszych pozycji z arkusza. W każdej części pytania A–D, a na końcu test literowy","size":8,"labels":["Część 1","Część 2","Część 3"],"cards":[{"h":"go off","t":"(o jedzeniu) zepsuć się","ex":"This milk smells sour. It must have gone off."},{"h":"prefer A to B","t":"wolę A niż B","ex":"I prefer reading thrillers to romances."},{"h":"get rid of","t":"pozbyć się","ex":"get rid of the snake. I won’t let you keep dangerous animals at home."},{"h":"so do I","t":"ja też","ex":"My father always starts his lunch with soup and so do I."},{"h":"be fed up with","t":"mieć dość","ex":"I’m fed up with it. I’m not interested in watching any more of the film."},{"h":"differ from","t":"różnić się od","ex":"Tom and Jerry are twin brothers but they differ from each other a lot."},{"h":"in comparison with","t":"w porównaniu z","ex":"I think my Volvo is much safer in comparison with your Fiat."},{"h":"equipment (niepoliczalne)","t":"sprzęt","ex":"There’s still my diving equipment that goes in the boot."},{"h":"make an impression on","t":"zrobić wrażenie na","ex":"The music you’ve composed has made a great impression on me."},{"h":"dependent on","t":"zależny od","ex":"Ann doesn’t want to be dependent on her parents."},{"h":"attend a lecture","t":"uczęszczać na wykład","ex":"You don’t have to attend all the lectures. Choose the ones that you like."},{"h":"blame sth on sb","t":"obwiniać za","ex":"The media and the politicians blame the collapse of the peace talks on the terrorists."}],"free":true,"shuffle":false},{"id":"t04","stage":"testy","title":"Test 4","desc":"12 najważniejszych pozycji z arkusza. W każdej części pytania A–D, a na końcu test literowy","size":8,"labels":["Część 1","Część 2","Część 3"],"cards":[{"h":"each other","t":"siebie nawzajem","ex":"Thomas and I are the best friends. We like each other very much."},{"h":"for instance","t":"na przykład","ex":"Mr Woods has worked in many exotic countries, for instance Pakistan."},{"h":"so far","t":"jak dotąd","ex":"So far, only thirty people have booked tickets for the performance."},{"h":"on average","t":"przeciętnie","ex":"on average, five cars are stolen in the city every night."},{"h":"take off","t":"wystartować (o samolocie)","ex":"The plane to Barcelona took off late because of a strike at the airport."},{"h":"neither do I","t":"ja też nie","ex":"My wife doesn’t eat pork meat and neither do I. We both prefer poultry."},{"h":"look for","t":"szukać","ex":"‘What are you looking for in the drawer?’ ‘I can’t find my car keys.’"},{"h":"arrive in + miasto","t":"przybyć do (miasta)","ex":"When you arrive in Washington, don’t forget to give us a call."},{"h":"be ashamed of","t":"wstydzić się","ex":"You should be ashamed of yourself. Look what you’ve done."},{"h":"speciality","t":"specjalność (dania)","ex":"Shrimps in tomato sauce are our speciality, sir. I strongly recommend it."},{"h":"put out","t":"zgasić (papierosa)","ex":"Put out the cigarette. You can’t smoke inside the opera."},{"h":"be in touch with","t":"być w kontakcie z","ex":"We haven’t been in touch with Angela ever since she moved out to Canada."}],"free":true,"shuffle":false},{"id":"t07","stage":"testy","title":"Test 7","desc":"12 najważniejszych pozycji z arkusza. W każdej części pytania A–D, a na końcu test literowy","size":8,"labels":["Część 1","Część 2","Część 3"],"cards":[{"h":"whether … or","t":"czy … czy","ex":"We were planning to go on the trip together but my friends have changed their mind. Now, I don’t know whether to give it up or to go by myself."},{"h":"on the whole","t":"ogólnie rzecz biorąc","ex":"Ralph can be boring at times but on the whole he is a nice young man."},{"h":"get married to","t":"wyjść za mąż / ożenić się z","ex":"Have you heard that Mary Chester got married to a Frenchman?"},{"h":"have sth done","t":"zlecić wykonanie usługi","ex":"When we bought the house it was just a ruin. Then, we had it renovated by a professional building company."},{"h":"You never know how …","t":"nigdy nie wiadomo, jak…","ex":"Don’t come close to the dog. You never know how dangerous it can be."},{"h":"operate on","t":"operować","ex":"Right after the accident, the young driver was operated on and now the doctors say he’s getting better."},{"h":"let sb down","t":"zawieść kogoś","ex":"At first, Mike promised to help me with the cleaning but he didn’t come at all. He real fire broke out."},{"h":"turn down","t":"odrzucić / ściszyć","ex":"Turn the music down."},{"h":"turn up","t":"pojawić się / pogłośnić","ex":"He never turns up on time."},{"h":"turn into","t":"zmienić się w","ex":"The frog turned into a prince."},{"h":"set off","t":"wyruszyć","ex":"We set off early."},{"h":"set up","t":"założyć","ex":"They set up a company."},{"h":"call off","t":"odwołać","ex":"The match was called off."},{"h":"make up","t":"wymyślić / pogodzić się","ex":"Don’t make up stories."}],"free":true,"link":"https://konkurs-angielski-gramatyka.adamf2000.chatgpt.site/lekcje.html","linkLabel":"Lekcje na stronie","linkIcon":"book"}],"passages":{"silent":{"title":"The Silent Library","text":"Every Saturday morning, Maya walks to the old library at the end of her street. It is a quiet place with tall windows and wooden shelves that smell of paper and polish. Last month the librarian, Mr Dunn, told her that the library might close because fewer people visit it. Maya decided to act. She made colourful posters and asked her classmates to join a reading club. Within three weeks, twenty-two children had signed up. Mr Dunn was so surprised that he forgot to be quiet and laughed out loud."},"octopus":{"title":"Clever Octopuses","text":"Octopuses are among the most intelligent animals in the sea. They have no bones, so they can squeeze through holes no bigger than a coin. An octopus has three hearts and blue blood. When in danger, it can change colour to hide or release a cloud of dark ink to confuse its enemy. Scientists have seen octopuses open jars and escape from tanks at night, which shows that they are very good at solving problems."},"pod1":{"title":"Transkrypcja: Great Britain and the UK","text":"Great Britain and the United Kingdom. They sound like two names for the same place, don't they? But there is an important difference. Picture a map of north-western Europe. Just off the coast, you can see a large island. That island is Great Britain. It contains three countries: England, Scotland and Wales. Now move your finger west, to the island of Ireland. Its north-eastern part is Northern Ireland. Add Northern Ireland to the three countries on Great Britain, and you get the United Kingdom. That's four countries altogether. The Republic of Ireland is a separate country. Let's take a short trip around the map. First stop: England. Its capital is London, and the River Thames runs through the city. In the north-west of England, the Lake District is a landscape of lakes, valleys and mountains. Farther south, in Wiltshire, stands Stonehenge: a famous prehistoric circle of enormous stones. Head west, and you reach Wales. Its capital is Cardiff. Welsh is a living language here, and you will often see signs in both Welsh and English. In the mountains of Eryri stands the highest peak in Wales: Snowdon, called Yr Wyddfa in Welsh. Travel north to Scotland. Its capital is Edinburgh. Beyond the city lie the Highlands, with their mountains, glens and lochs. Ben Nevis is here. At about one thousand three hundred and forty-five metres, it is the highest mountain in the whole United Kingdom. Finally, cross the Irish Sea to Northern Ireland. Its capital is Belfast. On the north coast, you can see the Giant's Causeway. Thousands of dark basalt columns meet the sea. They look almost like steps made by a giant, but they formed through volcanic activity. Before we finish, look at the water around the islands. The Atlantic Ocean is to the west. The North Sea is to the east of Great Britain. The English Channel lies between southern England and France. And the Irish Sea separates Great Britain from the island of Ireland. So, remember the simple rule. Great Britain means the large island and its three countries. The United Kingdom includes Northern Ireland as well."},"pod2":{"title":"Transkrypcja: Londyn","text":"Imagine you are standing beside the River Thames in London. You have one afternoon to recognise the city's most famous landmarks. Where should you begin? Start in Westminster, the political heart of the United Kingdom. The Palace of Westminster is where the two Houses of Parliament meet. Beside it stands the Elizabeth Tower. Many visitors call the whole tower Big Ben. Strictly speaking, Big Ben is the name of the great bell inside. If a question describes a clock tower next to Parliament, you know the place. Nearby is Westminster Abbey. Although it is a church, it has also been the setting for royal coronations for centuries. Remember the contrast: Parliament is where laws are debated; Westminster Abbey is connected with ceremonies, including coronations. Walk towards Buckingham Palace, the monarch's official London residence. The Changing of the Guard is a well-known ceremony outside the palace. Now return to the river. On the opposite bank, the London Eye is a large observation wheel. It offers views across the city. It is a modern attraction, unlike the historic abbey or the old fortress we will visit next. Travel east along the Thames to the Tower of London. The word tower may make you picture just one building. In fact, it is a historic castle and fortress. It has served as a royal palace and a prison, and today visitors can see the Crown Jewels there. Close by stands Tower Bridge, the famous bridge with two towers. Be careful: London Bridge is a different bridge. One final landmark is the British Museum, where collections tell stories of human history from around the world."},"pod3":{"title":"Transkrypcja: USA, miejsca","text":"The United States is a huge country, so let's cross it from east to west. At each stop, remember the name, the location and one reason it is famous. Our first stop is New York City. On an island in New York Harbor stands the Statue of Liberty. It is a monument representing freedom, and it became a powerful symbol for people arriving in America. In Manhattan, Central Park is a large green space among city streets and tall buildings. Do not confuse New York City with Washington, D.C., the national capital. In Washington, D.C., the White House is the official residence and workplace of the US president. The city also has the National Mall, with major monuments and museums. If a question asks for the country's capital, the answer is Washington, D.C., not New York. Now travel south-west to Arizona. The Grand Canyon is an enormous canyon carved by the Colorado River. Its colourful layers of rock make it one of America's best-known natural wonders. Remember: Grand Canyon, Arizona, Colorado River. The river's name does not mean that the canyon is in the state of Colorado. Head north towards Yellowstone National Park. Much of the park lies in Wyoming, and it extends into Montana and Idaho. It is famous for geothermal features, especially geysers such as Old Faithful, and for wildlife. A geyser sends hot water and steam into the air. Farther west, reach California. In San Francisco, the Golden Gate Bridge is a suspension bridge over the strait called the Golden Gate. It is recognised by its orange-red colour and its two tall towers. In Los Angeles, Hollywood is closely associated with the film industry. These two famous places are in the same state, but in different cities."},"pod4":{"title":"Transkrypcja: USA, geografia","text":"Picture a map of North America. The United States lies between Canada to the north and Mexico to the south. The Atlantic Ocean is on its eastern side, and the Pacific Ocean is to the west. The country has fifty states, but not all of them form one continuous block. Forty-eight states are connected in the main part of the country. Alaska is far to the north-west, next to Canada. Hawaii is a group of islands in the Pacific Ocean. Remember those two exceptions when you look at a map. Washington, D.C., is the national capital. It is a federal district, not one of the fifty states. Let's travel across the mainland. In the east, the Appalachian Mountains form an old mountain chain. Farther west, the Mississippi River flows south across the central part of the country towards the Gulf of Mexico. Together with its major tributary, the Missouri River, it forms one of North America's great river systems. A tributary is a river that flows into another river. The Great Plains are broad, mostly flat lands in the centre of the continent. Farther west stand the Rocky Mountains, often called the Rockies. Think of the simple order from east to west: Appalachians, Mississippi and the plains, Rockies, then the Pacific coast. The Colorado River is another important river. It carved the Grand Canyon in Arizona. The name Colorado appears in a river and in a state, but the Grand Canyon is in Arizona. What about the weather? The USA is so large that it has many climates. Alaska is generally much colder than the southern states. The south-west includes dry desert areas. Florida is warm and humid. Hawaii has a tropical climate. The north and the mountains can have cold, snowy winters."}},"questions":[{"id":"g01p1","unit":"g01","type":"mc","q":"I don’t mind ____ after school.","options":["waiting","wait","to wait"],"answer":0,"explain":"Mind łączy się z formą -ing."},{"id":"g01p2","unit":"g01","type":"mc","q":"I’d prefer ____ home.","options":["to stay","stay","staying"],"answer":0,"explain":"Would prefer to + czasownik."},{"id":"g01p3","unit":"g01","type":"mc","q":"I’d rather ____ home.","options":["stay","to stay","staying"],"answer":0,"explain":"Would rather + czasownik bez to."},{"id":"g01p4","unit":"g01","type":"mc","q":"Would you mind ____ the door?","options":["closing","close","to close"],"answer":0,"explain":"W prośbie would you mind użyj -ing."},{"id":"g01p5","unit":"g01","type":"mc","q":"I’d rather ____ out tonight.","options":["not go","not to go","not going"],"answer":0,"explain":"Would rather not + forma podstawowa."},{"id":"g01t1","unit":"g01","type":"mc","q":"We don’t mind ____ for the bus.","options":["waiting","wait","to wait"],"answer":0,"explain":"Mind łączy się z formą -ing."},{"id":"g01 "explain":"Would prefer to read; drugą czynność można dodać przez rather than watch."},{"id":"g01x8","unit":"g01","type":"mc","q":"Would you rather ____ tea or coffee?","options":["have","to have","having"],"answer":0,"explain":"Would rather + czasownik bez to: have."},{"id":"g01x9","unit":"g01","type":"mc","q":"My brother doesn’t mind ____ the dishes.","options":["wash","to wash","washing"],"answer":2,"explain":"Po doesn’t mind również używamy -ing: washing."},{"id":"g01y1","unit":"g01","type":"mc","q":"I don’t mind ____ you with your homework.","options":["help","helping","to help","helped"],"answer":1,"explain":"Po don’t mind używamy -ing."},{"id":"g01y2","unit":"g01","type":"mc","q":"I would prefer ____ before six.","options":["leave","leaving","to leave","left"],"answer":2,"explain":"Would prefer to + czasownik."},{"id":"g01y3","unit":"g01","type":"mc","q":"We’d rather ____ the museum today.","options":["visit","to visit","visiting","visited"],"answer":0,"explain":"Would rather + czasownik bez to."},{"id":"g01y4","unit":"g01","type":"mc","q":"Would you mind ____ so loudly?","options":["not speak","not speaking","not to speak","don’t speak"],"answer":1,"explain":"Would you mind not + -ing."},{"id":"g01y5","unit":"g01","type":"mc","q":"She’d prefer ____ the bus tonight.","options":["not take","not taking","not to take","to not taking"],"answer":2,"explain":"Would prefer not to + czasownik."},{"id":"g01y6","unit":"g01","type":"mc","q":"I’d rather ____ to that film again.","options":["not to go","not going","not go","don’t go"],"answer":2,"explain":"Would rather not + forma podstawowa."},{"id":"g01y7","unit":"g01","type":"mc","q":"They would prefer ____ at a small hotel.","options":["to stay","stay","staying","stayed"],"answer":0,"explain":"Would prefer to stay."},{"id":"g01y8","unit":"g01","type":"mc","q":"Would you rather ____ now or later?","options":["to eat","eating","eat","ate"],"answer":2,"explain":"Po would rather nie dodajemy to."},{"id":"g01y9","unit":"g01","type":"mc","q":"He doesn’t mind ____ on Saturdays.","options":["work","working","to work","worked"],"answer":1,"explain":"Mind + -ing, także w trzeciej osobie."},{"id":"g01y10","unit":"g01","type":"mc","q":"I’d prefer to walk ____ take a taxi.","options":["than","rather than","to","instead"],"answer":1,"explain":"Porównanie: would prefer to walk rather than take a taxi."},{"id":"g02p1","unit":"g02","type":"mc","q":"It was ____ cold that we stayed in.","options":["so","such","such a"],"answer":0,"explain":"So + przymiotnik."},{"id":"g02p2","unit":"g02","type":"mc","q":"It was ____ cold day.","options":["such a","so","such"],"answer":0,"explain":"Such a + przymiotnik + rzeczownik policzalny."},{"id":"g02p3","unit":"g02","type":"mc","q":"They are ____ friendly people.","options":["such","so","such a"],"answer":0,"explain":"Przed rzeczownikiem w liczbie mnogiej jest such bez a."},{"id":"g02p4","unit":"g02","type":"mc","q":"She runs ____ quickly.","options":["so","such","such a"],"answer":0,"explain":"Przed przysłówkiem używamy so."},{"id":"g02p5","unit":"g02","type":"mc","q":"It was ____ an exciting match.","options":["such","so","such a"],"answer":0,"explain":"Przed an/a + przymiotnik + rzeczownik używamy such."},{"id":"g02t1","unit":"g02","type":"mc","q":"The film was ____ funny that we laughed.","options":["so","such","such a"],"answer":0,"explain":"So + przymiotnik."},{"id":"g02t2","unit":"g02","type":"mc","q":"That is ____ interesting idea.","options":["such an","so","such"],"answer":0,"explain":"Such a + przymiotnik + rzeczownik policzalny."},{"id":"g02t3","unit":"g02","type":"mc","q":"Those were ____ difficult questions.","options":["such","so","such a"],"answer":0,"explain":"Przed rzeczownikiem w liczbie mnogiej jest such bez a."},{"id":"g02t4","unit":"g02","type":"mc","q":"He spoke ____ quietly.","options":["so","such","such a"],"answer":0,"explain":"Przed przysłówkiem używamy so."},{"id":"g02t5","unit":"g02","type":"mc","q":"We had ____ a good time.","opti :"I'm looking forward to ____ you.","options":["meeting","meet","met","to meet"],"answer":0,"explain":"Look forward to + forma -ing."},{"id":"g10","unit":"grammar","type":"mc","q":"There isn't ____ milk left in the fridge.","options":["any","some","no","a"],"answer":0,"explain":"W zdaniach przeczących używamy any."},{"id":"g11","unit":"grammar","type":"order","q":"Put the words in the correct order.","hint":"Ona uczy się angielskiego od trzech lat.","words":["She","has","been","learning","English","for","three","years"],"answer":"She has been learning English for three years","explain":"Present Perfect Continuous: has been + -ing, a for oznacza okres czasu."},{"id":"g12","unit":"grammar","type":"order","q":"Put the words in the correct order.","hint":"Jeśli jutro będzie padać, zostaniemy w domu.","words":["If","it","rains","tomorrow","we","will","stay","at","home","would"],"answer":"If it rains tomorrow we will stay at home","explain":"1. okres warunkowy: If + Present Simple, will + bezokolicznik. Słowo 'would' było zbędne."},{"id":"g13","unit":"grammar","type":"mc","q":"He asked me where ____.","options":["I lived","did I live","do I live","I had live"],"answer":0,"explain":"W pytaniach zależnych jest szyk oznajmujący: where I lived."},{"id":"g14","unit":"grammar","type":"mc","q":"You ____ wear a uniform at our school. It's a rule.","options":["must","might","needn't","can"],"answer":0,"explain":"Must = musieć (obowiązek wynikający z zasad)."},{"id":"g15","unit":"grammar","type":"mc","q":"The lights are on, so she ____ be at home.","options":["must","can't","shouldn't","needn't"],"answer":0,"explain":"Must wyraża tu pewny wniosek: na pewno jest w domu."},{"id":"g16","unit":"grammar","type":"type","q":"This pizza is ____ than that one. (good)","answers":["better"],"explain":"good – better – the best."},{"id":"g17","unit":"grammar","type":"mc","q":"I wish I ____ more free time.","options":["had","have","would have","has"],"answer":0,"explain":"I wish + Past Simple opisuje życzenie dotyczące teraźniejszości."},{"id":"g18","unit":"grammar","type":"mc","q":"How ____ people came to the party?","options":["many","much","a lot","few"],"answer":0,"explain":"How many pytamy o rzeczy policzalne (people)."},{"id":"p1","unit":"phrasal","type":"mc","q":"We had to ____ the match because of the rain.","options":["call off","call on","call up","call in"],"answer":0,"explain":"Call off = odwołać."},{"id":"p2","unit":"phrasal","type":"mc","q":"I can't ____ what he is saying. It's too noisy.","options":["make out","make up","make for","make off"],"answer":0,"explain":"Make out = dosłyszeć, zrozumieć, dostrzec."},{"id":"p3","unit":"phrasal","type":"mc","q":"Please ____ your shoes before you enter.","options":["take off","take out","take up","take in"],"answer":0,"explain":"Take off = zdjąć (ubranie, buty)."},{"id":"p4","unit":"phrasal","type":"mc","q":"She ____ her mother. They have the same smile.","options":["takes after","takes off","takes over","takes in"],"answer":0,"explain":"Take after = być podobnym do kogoś z rodziny."},{"id":"p5","unit":"phrasal","type":"mc","q":"Hurry up! We're ____ time.","options":["running out of","running away from","running into","running over"],"answer":0,"explain":"Run out of = kończyć się, zabraknąć."},{"id":"p6","unit":"phrasal","type":"mc","q":"'It's raining cats and dogs.' What does it mean?","options":["It is raining very heavily.","Animals are falling from the sky.","It is only drizzling.","It is windy."],"answer":0,"explain":"Idiom oznacza ulewę."},{"id":"p7","unit":"phrasal","type":"mc","q":"Before the match the coach said, 'Break a leg!' It means ____.","options":["good luck","be careful","run fast","you will get hurt"],"answer":0,"explain":"Break a leg = powodzenia."},{"id":"p8","unit":"phrasal","type":"mc","q":"'The test was a piece of cake.' It means the test was ____.","options":["very easy","sweet","dangerous","expensive"],"answer":0,"explain":"A piece of cake = bułka z masłem."},{"id":"p9","unit": stanowczy)."},{"id":"w8","unit":"wordform","type":"mc","q":"What is the opposite of 'responsible'?","options":["irresponsible","unresponsible","disresponsible","nonresponsible"],"answer":0,"explain":"Przedrostek ir- tworzy przeciwieństwo: irresponsible."},{"id":"w9","unit":"wordform","type":"mc","q":"Which is the adjective from 'danger'?","options":["dangerous","dangerful","dangering","dangerly"],"answer":0,"explain":"danger → dangerous (końcówka -ous)."},{"id":"w10","unit":"wordform","type":"type","q":"Don't be so ____! You nearly dropped the vase. (care)","answers":["careless"],"explain":"care → careless (bez troski, nieostrożny)."},{"id":"w11","unit":"wordform","type":"type","q":"His ____ was too difficult to follow. (explain)","answers":["explanation"],"explain":"explain → explanation (zmienia się też pisownia)."},{"id":"w12","unit":"wordform","type":"match","q":"Dopasuj rzeczownik do czasownika","pairs":[["success","succeed"],["choice","choose"],["growth","grow"],["belief","believe"]],"explain":"Rzeczowniki i czasowniki z jednej rodziny wyrazów."},{"id":"r1","unit":"reading","type":"mc","passageId":"silent","q":"Why might the library close?","options":["It is too old.","Fewer people visit it.","It is too noisy.","The books are damaged."],"answer":1,"explain":"Mr Dunn powiedział, że biblioteka może zostać zamknięta, bo odwiedza ją coraz mniej osób."},{"id":"r2","unit":"reading","type":"mc","passageId":"silent","q":"What did Maya do to help?","options":["She wrote to the mayor.","She made posters and invited classmates.","She bought new books.","She cleaned the shelves."],"answer":1,"explain":"Maya zrobiła plakaty i zaprosiła kolegów do klubu czytelniczego."},{"id":"r3","unit":"reading","type":"mc","passageId":"silent","q":"How many children signed up for the reading club?","options":["twelve","twenty","twenty-two","thirty-two"],"answer":2,"explain":"W tekście: twenty-two children had signed up."},{"id":"r4","unit":"reading","type":"mc","passageId":"silent","q":"Why did Mr Dunn laugh out loud?","options":["He heard a joke.","He was surprised by how many children joined.","He wanted to scare Maya.","He was nervous."],"answer":1,"explain":"Był tak zaskoczony, że zapomniał o ciszy w bibliotece."},{"id":"r5","unit":"reading","type":"mc","passageId":"octopus","q":"Why can an octopus squeeze through tiny holes?","options":["It is very small.","It has no bones.","It has eight arms.","It is very fast."],"answer":1,"explain":"W tekście: they have no bones."},{"id":"r6","unit":"reading","type":"mc","passageId":"octopus","q":"How many hearts does an octopus have?","options":["one","two","three","eight"],"answer":2,"explain":"An octopus has three hearts and blue blood."},{"id":"r7","unit":"reading","type":"mc","passageId":"octopus","q":"What can an octopus do to confuse its enemy?","options":["Make a loud noise.","Release dark ink.","Dig a hole.","Swim to the surface."],"answer":1,"explain":"Wypuszcza chmurę ciemnego atramentu."},{"id":"r8","unit":"reading","type":"mc","passageId":"octopus","q":"What do the jar and tank examples show?","options":["Octopuses are dangerous.","Octopuses are good at solving problems.","Octopuses like living in tanks.","Octopuses are afraid of people."],"answer":1,"explain":"Autor podaje je jako dowód, że ośmiornice dobrze radzą sobie z problemami."},{"id":"t01a01","unit":"t01","type":"mc","q":"Isn't it ____ time you started revising for your examinations?","options":["high","late","good","right"],"answer":0,"explain":"it’s high time + Past Simple = najwyższy czas, żebyś…."},{"id":"t01a02","unit":"t01","type":"mc","q":"This is the most beautiful place I have ____ been to.","options":["ever","yet","already","still"],"answer":0,"explain":"the most … I have ever been to = najpiękniejsze miejsce, w jakim kiedykolwiek byłem."},{"id":"t01a03","unit":"t01","type":"mc","q":"The children are already looking ____ to summer holidays.","options":["forward","ahead","after","up"],"answer":0,"explain":"look forward to + - function plLit(n){return n===1?'litera':(n%10>=2&&n%10<=4&&(n%100<12||n%100>14))?'litery':'liter';}
function maskOf(q){
  var as=q.answers||[];if(!as.length)return null;
  var a=String(as[0]),cnt=function(x){return String(x).replace(/[ \-’']/g,'').length;},len=cnt(a);
  if(as.some(function(x){return cnt(x)!==len;}))return {first:a.charAt(0)};
  var words=a.split(' '),out=[],rv=0;
  words.forEach(function(w,wi){
    var n=w.length,show={};
    if(n>=3){show[0]=1;show[n-1]=1;if(n>=8)show[Math.floor(n/2)]=1;}else show[0]=1;
    for(var i=0;i<n;i++){var ch=w.charAt(i),isL=/[A-Za-z]/.test(ch),r=!isL||!!show[i];if(isL&&r)rv++;out.push({c:ch,r:r});}
    if(wi<words.length-1)out.push({sp:1});
  });
  return {slots:out,count:len,rev:rv};
}

var SR=window.SpeechRecognition||window.webkitSpeechRecognition,REC=null;
function sayNorm(s){return String(s).toLowerCase().replace(/[’‘`´]/g,"'").replace(/[^a-z0-9' \-]/g,' ').replace(/\s+/g,' ').trim();}
function lcsRatio(a,b){var m=a.length,n=b.length,d=[],i,j;for(i=0;i<=m;i++){d[i]=[];for(j=0;j<=n;j++)d[i][j]=0;}for(i=1;i<=m;i++)for(j=1;j<=n;j++)d[i][j]=a[i-1]===b[j-1]?d[i-1][j-1]+1:Math.max(d[i-1][j],d[i][j-1]);return n?d[m][n]/n:0;}
function sayStop(){try{if(REC)REC.abort();}catch(e){}REC=null;}
function sayStart(manual){
  var q=cur(),c=L.cur;if(L.status)return;sayStop();
  if(q.type==='match'||!SR){c.say={m:'self',show:false,nosr:q.type!=='match'};render();return;}
  var ref=c,rec,got=false;
  try{rec=new SR();}catch(e){c.say={m:'self',show:false,nosr:true};render();return;}
  REC=rec;rec.lang='en-US';rec.interimResults=false;rec.maxAlternatives=5;rec.continuous=false;
  c.say={m:'listen'};render();
  rec.onresult=function(ev){got=true;var r=ev.results[0],alts=[];for(var i=0;i<r.length;i++)alts.push(r[i].transcript);if(L&&L.cur===ref&&!L.status)sayEval(alts);};
  rec.onerror=function(ev){if(got||!(L&&L.cur===ref&&!L.status))return;var e=ev&&ev.error;ref.say=(e==='no-speech'||e==='aborted')?{m:'none'}:((e==='not-allowed'||e==='service-not-allowed')&&!manual)?{m:'idle'}:{m:'self',show:false,nosr:true};render();};
  rec.onend=function(){if(!got&&L&&L.cur===ref&&!L.status&&ref.say&&ref.say.m==='listen'){ref.say={m:'none'};render();}};
  try{rec.start();}catch(e){c.say={m:'self',show:false,nosr:true};render();}
}
function sayEval(alts){
  var q=cur(),c=L.cur,A=alts.map(sayNorm),heard=alts[0]||'';
  if(q.type==='mc'){
    var hit=-1;
    c.opts.forEach(function(o,k){var t=sayNorm(o.t);if(t&&A.some(function(a){return (' '+a+' ').indexOf(' '+t+' ')>=0;})&&(hit<0||o.i===q.answer))hit=k;});
    if(hit<0){var nm={one:0,'1':0,two:1,'2':1,three:2,'3':2,four:3,'4':3};A.some(function(a){return a.split(' ').some(function(w){if(nm.hasOwnProperty(w)&&nm[w]<c.opts.length){hit=nm[w];return true;}return false;});});}
    if(hit>=0){c.sel=hit;resolve(c.opts[hit].i===q.answer,false);return;}
  }else if(q.type==='type'){
    var ok=A.some(function(a){return q.answers.some(function(x){var n=sayNorm(x);return n&&(a===n||(' '+a+' ').indexOf(' '+n+' ')>=0);});});
    if(ok){c.val=q.answers[0];resolve(true,false);return;}
  }else if(q.type==='order'){
    var t=sayNorm(q.answer).split(' ');
    if(A.some(function(a){return a===t.join(' ')||lcsRatio(a.split(' '),t)>=0.9;})){resolve(true,false);return;}
  }
  c.say={m:'miss',heard:heard};render();
}
